<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOT-14 Navigation Simplification</title>
  <meta name="figma-source" content="node:1214:15389 page:1214:13477 file:TArUrZsBUocaAsqetjXq7V">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #0A0C16; --card: #10121C; --elevated: #151722;
      --text-pri: #E0DFE4; --text-sec: rgba(224,223,228,0.6); --text-ter: rgba(224,223,228,0.4); --text-dim: rgba(224,223,228,0.2);
      --border-normal: rgba(224,223,228,0.07);
      --accent: #7FB5B0; --accent-dim: rgba(127,181,176,0.12);
      --red: #C47878;
      --glass-bg: linear-gradient(135deg, rgba(224,223,228,0.05) 0%, rgba(224,223,228,0.015) 100%);
      --glass-border: rgba(224,223,228,0.08);
      --glass-highlight: inset 0 1px 0 rgba(224,223,228,0.06);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--canvas);
      color: var(--text-sec);
      padding: 24px;
    }

    body.embedded { padding: 0; min-height: auto; display: block; background: transparent; overflow: hidden; }
    body.embedded .diagram { width: 100%; max-width: none; border-radius: 0; }

    /* Container — Figma 1214:15389: py-[24px] outer, no horizontal pad on the
       background; px-[48px] lives on .comparison instead. */
    .diagram {
      background: var(--canvas);
      border-radius: 16px;
      padding: 24px 0;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Comparison row — Figma desktop: gap 48px, px-[48px]. */
    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
      padding: 0 48px;
    }

    /* Per-column stack — Figma: flex-col gap-[16px] (label / pill / caption). */
    .col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      min-width: 0;
    }

    /* Label — Figma: centered, no dot, Inter SemiBold 10/600/1px tracking. */
    .col-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1;
    }

    .col.before .col-label { color: var(--red); }
    .col.after .col-label { color: var(--accent); }

    /* .screenshot wraps the pill with breathing-room padding.
       Figma desktop: h-[44px] px-[8px] on the wrapper; pill aspect is set on
       the inner mock so the asset (pre-cropped) never stretches. */
    .screenshot {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }

    /* Pill slot — sized to match the pre-cropped PNG exports (644×110 / 644×112).
       Figma uses 306/43 on uncropped source images; our PNGs are pre-cropped
       so the slot frames the asset directly without crop math. NO aspect-ratio
       on .mock — that combined with box-sizing: border-box + 6px border made
       the content-box aspect different from the source PNG aspect, causing
       object-fit: cover to crop icons at top/bottom. IMG inside now carries
       the aspect-ratio and renders at its natural shape with no clipping. */
    .mock {
      flex: 1;
      min-width: 0;
      border: 6px solid #fff;       /* white pill bezel — intentional */
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    .mock img {
      display: block;
      width: 100%;
      height: auto;                 /* let height scale with natural aspect */
      aspect-ratio: 644 / 110;
    }
    .col.after .mock img { aspect-ratio: 644 / 112; }

    /* Caption — Figma: JetBrains Mono Regular 9/400, tracking 0.36px,
       color text-tertiary rgba(224,223,228,0.4), centered. */
    .col-caption {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.36px;
      line-height: 1;
      color: var(--text-ter);
      text-align: center;
      width: 100%;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .col { animation: fadeSlideIn 0.6s ease-out forwards; }
    .col:nth-child(2) { animation-delay: 0.1s; }

    /* Mobile — Figma 1214:18896: still side-by-side, gap-[16px], px-[16px]. */
    @media (max-width: 480px) {
      .comparison { gap: 16px; padding: 0 16px; }
      .col { gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="diagram">
    <div class="comparison">
      <div class="col before">
        <div class="col-label">Before</div>
        <div class="screenshot">
          <div class="mock">
            <img src="assets/not14-legacy-nav.png" alt="Legacy 5-tab navigation">
          </div>
        </div>
        <div class="col-caption">5 tab layout</div>
      </div>
      <div class="col after">
        <div class="col-label">After</div>
        <div class="screenshot">
          <div class="mock">
            <img src="assets/not14-unified-nav.png" alt="Unified 3-tab navigation">
          </div>
        </div>
        <div class="col-caption">3 tab model</div>
      </div>
    </div>
  </div>

<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v2 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  // Respond to parent re-measure requests (fires on any iframe-width change)
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
</html>
