<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="figma-source" content="node:1490:7615 page:29:41 file:TArUrZsBUocaAsqetjXq7V">
  <title>SHR-03 — Research Overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --canvas: #0A0C16;
      --card: #10121C;
      --elevated: #151722;
      --highest: #1A1C28;
      --text-pri: #E0DFE4;
      --text-sec: rgba(224,223,228,0.6);
      --text-ter: rgba(224,223,228,0.4);
      --text-dim: rgba(224,223,228,0.2);
      --border-normal: rgba(224,223,228,0.07);
      --accent: #7FB5B0;
      --accent-dim: rgba(127,181,176,0.12);
      --red: #C47878;
      --red-dim: rgba(196,120,120,0.12);
      --casual: #C4B078;
      --casual-dim: rgba(196,176,120,0.12);
      --new-seg: #8A9EC4;
      --new-seg-dim: rgba(138,158,196,0.12);
      --glass-bg: linear-gradient(158.643deg, rgba(224,223,228,0.05) 0%, rgba(224,223,228,0.016) 71.429%);
      --glass-border: rgba(224,223,228,0.08);
      --glass-highlight: inset 0 1px 0 rgba(224,223,228,0.06);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      background: #08090F;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--text-pri);
    }

    .diagram {
      max-width: 760px;
      width: 100%;
      background: transparent;
      border-radius: 16px;
      overflow: hidden;
      padding: 0 48px;
    }

    .matrix-area {
      padding: 24px 16px;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 8px;
      width: 100%;
    }

    .quad {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px 20px 24px;
      border-radius: 12px;
      background: var(--glass-bg);
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
    }
    .quad.q1 { animation: fadeUp 600ms var(--spring) 100ms forwards; }
    .quad.q2 { animation: fadeUp 600ms var(--spring) 200ms forwards; }
    .quad.q3 { animation: fadeUp 600ms var(--spring) 300ms forwards; }
    .quad.q4 { animation: fadeUp 600ms var(--spring) 400ms forwards; }

    /* Persona header (icon + title) */
    .persona-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .persona-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .persona-icon svg { width: 14px; height: 14px; display: block; }

    .persona-title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    /* Per-quad color theming */
    .quad.q1 .persona-icon { background: var(--casual-dim); color: var(--casual); }
    .quad.q1 .persona-title { color: var(--casual); }
    .quad.q1 .bullet        { background: var(--casual); }

    .quad.q2 .persona-icon { background: var(--accent-dim); color: var(--accent); }
    .quad.q2 .persona-title { color: var(--accent); }
    .quad.q2 .bullet        { background: var(--accent); }

    .quad.q3 .persona-icon { background: var(--red-dim); color: var(--red); }
    .quad.q3 .persona-title { color: var(--red); }
    .quad.q3 .bullet        { background: var(--red); }

    .quad.q4 .persona-icon { background: var(--new-seg-dim); color: var(--new-seg); }
    .quad.q4 .persona-title { color: var(--new-seg); }
    .quad.q4 .bullet        { background: var(--new-seg); }

    /* Strategy bullets */
    .strategies {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .strategy {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .bullet {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      margin-top: 4.5px;
      flex-shrink: 0;
    }
    .strategy-text {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 400;
      line-height: 13px;
      color: var(--text-sec);
      flex: 1;
      min-width: 0;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile: stack 4 quads in a single column */
    @media (max-width: 480px) {
      .diagram { padding: 0 16px; }
      .matrix-area { padding: 16px 0; }
      .grid { grid-template-columns: 1fr; grid-template-rows: auto; }
      .persona-title { white-space: normal; }
    }

    /* Embed mode: strip body chrome when loaded in iframe */
    body.embedded {
      padding: 0;
      min-height: auto;
      display: block;
      background: transparent;
      overflow: hidden;
      align-items: initial;
    }
    body.embedded .diagram {
      width: 100%;
      border-radius: 0;
    }
  </style>
</head>
<body>

      </div>

  </div>

<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v1 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
