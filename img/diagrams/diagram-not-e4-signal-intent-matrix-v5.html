<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOT-E4 — Signal × Intent Matrix</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0A0C16; --card: #10121C;
    --text-pri: #E0DFE4; --text-sec: rgba(224,223,228,0.6); --text-ter: rgba(224,223,228,0.4); --text-dim: rgba(224,223,228,0.2);
    --accent: #7FB5B0; --accent-dim: rgba(127,181,176,0.12);
    --gold: #C4B078; --red: #C47878; --blue: #8A9EC4;
    --glass-bg: linear-gradient(135deg, rgba(224,223,228,0.05) 0%, rgba(224,223,228,0.015) 100%);
    --glass-border: rgba(224,223,228,0.08);
    --glass-highlight: inset 0 1px 0 rgba(224,223,228,0.06);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--canvas); display: flex; justify-content: center; padding: 40px;
    font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .diagram {
    max-width: 760px; width: 100%; background: var(--canvas); border-radius: 16px; overflow: hidden; position: relative;
    padding: 0 48px;
  }

  /* ── Matrix ── */
  .matrix-area {
    padding: 24px 16px; position: relative;
    display: flex; flex-direction: column; gap: 12px;
    opacity: 0; animation: mount 0.5s var(--spring) 0.1s forwards;
  }
  .matrix-area::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 350px 280px at 50% 50%, rgba(127,181,176,0.03) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Column headers */
  .col-headers {
    display: flex; padding-left: 56px; gap: 8px;
  }
  .col-header {
    flex: 1; text-align: center;
  }
  .col-header-title {
    font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--text-ter);
  }

  /* Matrix body */
  .matrix-body {
    display: flex; align-items: stretch; gap: 0;
  }

  /* Y axis */
  .y-axis {
    width: 56px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 8px;
    align-self: stretch;
  }
  .y-label-cell {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding-right: 10px; text-align: right;
  }
  .y-label-title {
    font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--text-ter);
  }

  /* Grid */
  .grid {
    flex: 1; display: grid;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 8px;
  }

  /* Quadrant cards */
  .quad {
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 20px 20px 24px;
    display: flex; flex-direction: column; gap: 16px;
    backdrop-filter: blur(8px); position: relative; overflow: hidden;
    transition: transform 0.35s var(--spring), border-color 0.3s ease;
    cursor: default;
  }
  .quad::before {
    content: ''; position: absolute; inset: 0;
    box-shadow: var(--glass-highlight); border-radius: 12px; pointer-events: none;
  }
  .quad:hover {
    transform: scale(1.02); border-color: rgba(224,223,228,0.14);
  }

  /* Colored top glow per quadrant */
  .quad::after {
    content: ''; position: absolute; width: 80px; height: 80px; border-radius: 50%;
    top: -24px; left: 50%; transform: translateX(-50%);
    pointer-events: none; opacity: 0.5;
  }
  .quad.new-user::after { background: radial-gradient(circle, rgba(196,176,120,0.1) 0%, transparent 70%); }
  .quad.casual-scroller::after { background: radial-gradient(circle, rgba(127,181,176,0.12) 0%, transparent 70%); }
  .quad.casual-seeker::after { background: radial-gradient(circle, rgba(196,120,120,0.08) 0%, transparent 70%); }
  .quad.core-contributor::after { background: radial-gradient(circle, rgba(138,158,196,0.1) 0%, transparent 70%); }

  /* Persona header with icon */
  .persona-header {
    display: flex; align-items: center; gap: 10px;
  }
  .persona-icon {
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .new-user .persona-icon { background: rgba(196,176,120,0.12); }
  .casual-scroller .persona-icon { background: rgba(127,181,176,0.12); }
  .casual-seeker .persona-icon { background: rgba(196,120,120,0.1); }
  .core-contributor .persona-icon { background: rgba(138,158,196,0.12); }
  .persona-icon svg { width: 16px; height: 16px; }

  /* Quad persona label */
  .persona {
    font-size: 16px; font-weight: 700; color: var(--text-pri);
    letter-spacing: -0.16px;
    line-height: normal;
  }
  .new-user .persona { color: var(--gold); }
  .casual-scroller .persona { color: var(--accent); }
  .casual-seeker .persona { color: var(--red); }
  .core-contributor .persona { color: var(--blue); }

  /* Strategy items */
  .strategies {
    display: flex; flex-direction: column; gap: 8px; width: 100%;
  }
  .strategy {
    font-size: 11px; color: var(--text-sec); line-height: 13px;
    display: flex; align-items: flex-start; gap: 6px;
  }
  .strategy::before {
    content: ''; display: block; width: 4px; height: 4px; border-radius: 50%;
    flex-shrink: 0; margin-top: 4.5px; opacity: 0.5;
  }
  .new-user .strategy::before { background: var(--gold); }
  .casual-scroller .strategy::before { background: var(--accent); }
  .casual-seeker .strategy::before { background: var(--red); }
  .core-contributor .strategy::before { background: var(--blue); }

  /* Stagger */
  .quad:nth-child(1) { opacity: 0; animation: mountQ 0.5s var(--spring) 0.2s forwards; }
  .quad:nth-child(2) { opacity: 0; animation: mountQ 0.5s var(--spring) 0.3s forwards; }
  .quad:nth-child(3) { opacity: 0; animation: mountQ 0.5s var(--spring) 0.35s forwards; }
  .quad:nth-child(4) { opacity: 0; animation: mountQ 0.5s var(--spring) 0.45s forwards; }

  @keyframes mount { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes mountQ { from { opacity:0; transform:scale(0.94); } to { opacity:1; transform:scale(1); } }

  /* Embed mode */
  body.embedded { padding: 0; min-height: auto; display: block; background: transparent; overflow: hidden; }
  body.embedded .diagram { border-radius: 0; width: 100%; }

  /* ── ≤600px mobile: per Figma 1401:876 — no icons, smaller persona, tighter quad.
       Threshold raised from 480 default because desktop labels ("Browsing casual visitor",
       "Searching casual visitor") wrap badly when 2-column compresses below ~600px;
       mobile layout removes icons and gives the labels room to breathe. ── */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .diagram { padding: 0; }
    .matrix-area { padding: 24px 16px; }
    .quad { padding: 12px 12px 16px; }
    .persona-icon { display: none; }
    .persona { font-size: 14px; }
  }

  /* ── ≤360px floor: collapse to single column when 2×2 becomes unreadable ── */
  @media (max-width: 360px) {
    .col-headers { display: none; }
    .y-axis { display: none; }
    .grid {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
    }
  }
</style>
</head>
<body>
<div class="diagram">

  <div class="matrix-area">
    <!-- Column headers per Figma 1401:1048 -->
    <div class="col-headers">
      <div class="col-header">
        <div class="col-header-title">Low Signal</div>
      </div>
      <div class="col-header">
        <div class="col-header-title">High Signal</div>
      </div>
    </div>

    <div class="matrix-body">
      <!-- Y axis labels per Figma 1401:1054 -->
      <div class="y-axis">
        <div class="y-label-cell">
          <div class="y-label-title">Low intent</div>
        </div>
        <div class="y-label-cell">
          <div class="y-label-title">High intent</div>
        </div>
      </div>

      <!-- 2×2 Grid -->
      <div class="grid">
        <!-- Top-left: Low intent, Low signal = New user -->
        <div class="quad new-user">
          <div class="persona-header">
            <div class="persona-icon"><svg viewBox="0 0 16 16" fill="none"><path d="M8 2c-2.5 0-4.5 2-4.5 4.5v3L2 11v1h12v-1l-1.5-1.5v-3C12.5 4 10.5 2 8 2z" stroke="#C4B078" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 13a1.5 1.5 0 003 0" stroke="#C4B078" stroke-width="1.2" stroke-linecap="round"/></svg></div>
            <div class="persona">New user</div>
          </div>
          <div class="strategies">
            <div class="strategy">Build understanding</div>
            <div class="strategy">Provide guidance</div>
          </div>
        </div>

        <!-- Top-right: Low intent, High signal = Browsing casual visitor -->
        <div class="quad casual-scroller">
          <div class="persona-header">
            <div class="persona-icon"><svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5l1.76 3.57 3.94.57-2.85 2.78.67 3.93L8 10.5l-3.52 1.85.67-3.93L2.3 5.64l3.94-.57L8 1.5z" stroke="#7FB5B0" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
            <div class="persona">Browsing casual visitor</div>
          </div>
          <div class="strategies">
            <div class="strategy">Deliver preferences</div>
            <div class="strategy">Provide guidance</div>
          </div>
        </div>

        <!-- Bottom-left: High intent, Low signal = Searching casual visitor -->
        <div class="quad casual-seeker">
          <div class="persona-header">
            <div class="persona-icon"><svg viewBox="0 0 16 16" fill="none"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="#C47878" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" stroke="#C47878" stroke-width="1.2"/></svg></div>
            <div class="persona">Searching casual visitor</div>
          </div>
          <div class="strategies">
            <div class="strategy">Build understanding</div>
            <div class="strategy">Empower the user to achieve goals</div>
          </div>
        </div>

        <!-- Bottom-right: High intent, High signal = Regular -->
        <div class="quad core-contributor">
          <div class="persona-header">
            <div class="persona-icon"><svg viewBox="0 0 16 16" fill="none"><path d="M13.5 2.5l-9 9L2 14l2.5-2.5 9-9z" stroke="#8A9EC4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 5l2-2" stroke="#8A9EC4" stroke-width="1.2" stroke-linecap="round"/></svg></div>
            <div class="persona">Regular</div>
          </div>
          <div class="strategies">
            <div class="strategy">Deliver preferences</div>
            <div class="strategy">Empower the user to achieve goals</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v2 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  // Respond to parent re-measure requests (fires on any iframe-width change)
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
</html>
