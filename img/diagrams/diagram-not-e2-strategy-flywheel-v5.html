<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="figma-source" content="node:1406:2673 mobile:1214:18129 file:TArUrZsBUocaAsqetjXq7V">
  <title>NOT-E2 Strategy Flywheel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #0A0C16;
      --card: #10121C;
      --card-elevated: #161923;            /* Figma stage card bg */
      --text-pri: #E0DFE4;
      --text-sec: rgba(224,223,228,0.6);
      --text-ter: rgba(224,223,228,0.4);
      --text-mono: #c7ccd9;                /* Figma loop-back primary text */
      --border-normal: rgba(224,223,228,0.07);
      --accent: #7FB5B0;
      --accent-dim: rgba(127,181,176,0.12);
      --transition-label: #272a3b;         /* Figma 1406:2862 desktop transition label */
      --transition-label-mobile: #8c94a6;  /* Figma 1214:18160 mobile transition caption */
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--canvas);
      color: var(--text-pri);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    body.embedded { padding: 0; min-height: auto; display: block; background: transparent; overflow: hidden; }
    body.embedded .diagram { width: 100%; max-width: none; border-radius: 0; }

    .diagram {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    /* ── Flywheel: 3 cards + 2 transitions, equal-height via stretch ── */
    /* Figma 1406:2673 — outer py-24px, stages row px-48px, gap-12px, h-169px */
    .flywheel-stages {
      display: flex;
      gap: 12px;
      align-items: stretch;       /* equal-height cards */
      justify-content: center;
      padding: 24px 48px 0;
    }

    .stage {
      flex: 1;
      background: var(--card-elevated);
      border-radius: 12px;
      padding: 12px 8px;          /* Figma py-12 px-8 (stage 3 has px-10) */
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;                   /* Figma gap-8 between header + items */
      text-align: left;
      overflow: hidden;
    }

    /* Stage header: badge + title stacked, gap-12 */
    .stage-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
    }

    .stage-num {
      width: 32px;
      height: 32px;
      background: var(--accent-dim);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .stage-title {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-pri);
      letter-spacing: -0.16px;
      line-height: 1.2;
      text-transform: none;
    }

    /* Hair divider beneath the stage header — Figma 1406:2736 */
    .stage-hair {
      width: 40px;
      height: 1px;
      background: var(--border-normal);
      flex-shrink: 0;
    }

    /* Stage items list */
    .stage-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stage-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-sec);
    }

    .stage-item-bullet {
      width: 4px;
      height: 4px;
      background: var(--text-sec);
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── Transition between stages — horizontal arrow + caption ── */
    /* Figma 1406:2861 — w-105px, pt-32px pb-42px, gap-8px, label JetBrains Mono 12px #272a3b */
    .transition-arrow {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      width: 105px;
      padding: 32px 0 42px;
    }

    .transition-arrow-symbol {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 400;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.5px;
      width: 100%;
      text-align: center;
    }

    .transition-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 400;
      color: var(--transition-label);
      text-align: center;
      line-height: 1.6;
      width: 100%;
    }

    /* ── Bottom return loop — horizontal teal line + uppercase label on the right ── */
    /* Figma 1406:2892 — px-48px, gap-16px, label Inter Semi Bold 11px tracking 0.88px */
    .return-loop {
      display: flex;
      align-items: center;
      gap: 16px;
      /* padding-top bumped 8 → 16 per Della to add breathing room between
         the stage cards and the return-loop stroke. */
      padding: 16px 48px 24px;
    }

    .return-line {
      flex: 1;
      height: 1px;
      background: var(--accent);
    }

    .loop-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.88px;
      line-height: 1.4;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .loop-glyph {
      font-size: 14px;
      font-weight: 400;
    }

    /* Mobile-only loop-back panel (dashed border, icon + 2-line caption) — hidden on desktop */
    .loop-back { display: none; }

    /* Intermediate compression: 720px → 560px keeps horizontal layout but tightens chrome */
    @media (max-width: 720px) {
      .flywheel-stages { gap: 8px; padding: 24px 16px 0; }
      .transition-arrow { width: 60px; padding: 24px 0 32px; }
      .transition-label { font-size: 11px; }
      .return-loop { padding: 8px 16px 24px; }
    }
    @media (max-width: 560px) {
      .flywheel-stages { gap: 4px; padding: 20px 8px 0; }
      .transition-arrow { width: 32px; padding: 20px 0 28px; }
      .transition-arrow-symbol { font-size: 20px; }
      .transition-label { display: none; }
      .stage-title { font-size: 14px; }
      .stage-item { font-size: 11px; }
      .return-loop { padding: 8px 12px 20px; }
    }

    /* ── Mobile breakpoint — match Figma 1214:18129 vertical layout ──
       At/below 480px the diagram switches to a vertical stack: stages full-width,
       transitions become small vertical arrow + uppercase JetBrains Mono caption,
       and the bottom return loop is replaced with a dashed-border .loop-back panel. */
    @media (max-width: 480px) {
      .flywheel-stages {
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 24px 16px 8px;
      }
      .stage {
        width: 100%;
        padding: 16px;
        gap: 12px;
      }
      .stage-title { font-size: 16px; }
      .stage-item { font-size: 11px; line-height: 16px; }

      .transition-arrow {
        flex-direction: row;
        width: auto;
        padding: 8px 0 8px 30px;
        gap: 16px;
        align-items: center;
        justify-content: flex-start;
      }
      .transition-arrow-symbol {
        display: inline-block;
        font-size: 20px;
        line-height: 1;
        width: auto;
        transform: rotate(90deg);
        transform-origin: center;
        color: var(--accent);
      }
      .transition-label {
        display: block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        color: var(--transition-label-mobile);
        text-align: left;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        width: auto;
      }

      /* Hide the desktop return-loop, show the mobile loop-back panel */
      .return-loop { display: none; }
      .loop-back {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 16px 24px;
        padding: 12px 14px;
        /* Fill + stroke removed per Della — panel sits flat on the diagram bg. */
      }
      .loop-back-icon {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: var(--accent);
        line-height: 1;
      }
      .loop-back-text {
        display: flex;
        flex-direction: column;
        gap: 3px;
        flex: 1;
        min-width: 0;
      }
      .loop-back-pri {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        line-height: 14px;
        color: var(--text-mono);
        letter-spacing: 0.7px;
        text-transform: uppercase;
      }
      .loop-back-sec {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        font-weight: 500;
        line-height: 13px;
        color: rgba(127,181,176,0.85);
        letter-spacing: 0.7px;
        text-transform: uppercase;
      }
    }
  </style>
</head>
<body>
  <div class="diagram" data-diagram-id="not-e2">
    <div class="flywheel-stages">

      <!-- Stage 1: Leverage signal -->
      <div class="stage">
        <div class="stage-header">
          <div class="stage-num">1</div>
          <div class="stage-title">Leverage signal</div>
          <div class="stage-hair"></div>
        </div>
        <ul class="stage-items">
          <li class="stage-item"><span class="stage-item-bullet"></span><span>Geo &amp; SEO</span></li>
          <li class="stage-item"><span class="stage-item-bullet"></span><span>Behavior</span></li>
          <li class="stage-item"><span class="stage-item-bullet"></span><span>Contribution</span></li>
        </ul>
      </div>

      <!-- Transition 1 -->
      <div class="transition-arrow">
        <span class="transition-arrow-symbol">&rarr;</span>
        <span class="transition-label">feeds value</span>
      </div>

      <!-- Stage 2: Deliver value -->
      <div class="stage">
        <div class="stage-header">
          <div class="stage-num">2</div>
          <div class="stage-title">Deliver value</div>
          <div class="stage-hair"></div>
        </div>
        <ul class="stage-items">
          <li class="stage-item"><span class="stage-item-bullet"></span><span>Community subscriptions</span></li>
          <li class="stage-item"><span class="stage-item-bullet"></span><span>Replies</span></li>
        </ul>
      </div>

      <!-- Transition 2 -->
      <div class="transition-arrow">
        <span class="transition-arrow-symbol">&rarr;</span>
        <span class="transition-label">refines tuning</span>
      </div>

      <!-- Stage 3: Tune experience -->
      <div class="stage">
        <div class="stage-header">
          <div class="stage-num">3</div>
          <div class="stage-title">Tune experience</div>
          <div class="stage-hair"></div>
        </div>
        <ul class="stage-items">
          <li class="stage-item"><span class="stage-item-bullet"></span><span>Insights</span></li>
          <li class="stage-item"><span class="stage-item-bullet"></span><span>Suggestions</span></li>
          <li class="stage-item"><span class="stage-item-bullet"></span><span>Reminders</span></li>
        </ul>
      </div>

    </div>

    <!-- Return loop: signal flows back to start (desktop) -->
    <div class="return-loop" aria-label="Return loop: tuning strengthens signal">
      <div class="return-line"></div>
      <div class="loop-label"><span class="loop-glyph">&#8635;</span><span>Tuning strengthens signal</span></div>
    </div>

    <!-- Mobile loop-back panel — Figma 1214:18212 -->
    <div class="loop-back" aria-label="Tuning strengthens signal — cycle continues back to stage 1">
      <span class="loop-back-icon">&#8635;</span>
      <div class="loop-back-text">
        <span class="loop-back-pri">Tuning strengthens signal</span>
        <span class="loop-back-sec">Cycle continues &mdash; back to stage 1</span>
      </div>
    </div>

  </div>

<!-- diagram-height-poster v2 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  // Respond to parent re-measure requests (fires on any iframe-width change)
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
</html>
