<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="figma-source" content="node:1409:1833 page:1214:13477 file:TArUrZsBUocaAsqetjXq7V">
<title>NOT-12 — Inbox Layout Experiments (3 layouts)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0A0C16; --card: #10121C; --elevated: #151722; --surface-3: #1a1c28;
    --text-pri: #E0DFE4; --text-sec: rgba(224,223,228,0.6); --text-ter: rgba(224,223,228,0.4); --text-dim: rgba(224,223,228,0.2);
    --border-normal: rgba(224,223,228,0.07);
    --accent: #7FB5B0; --accent-hover: #8AC4BE; --accent-dim: rgba(127,181,176,0.12);
    --red: #C47878;
    --glass-bg: linear-gradient(135deg, rgba(224,223,228,0.05) 0%, rgba(224,223,228,0.015) 100%);
    --glass-border: rgba(224,223,228,0.08);
    --glass-highlight: inset 0 1px 0 rgba(224,223,228,0.06);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--canvas); display: flex; justify-content: center; padding: 40px;
    font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
  }
  /* Flat on page per Della 2026-05-10 — no own canvas bg, no noise overlay,
     no border-radius creating a card boundary against the parent page. */
  .diagram {
    width: 100%; max-width: 760px; overflow: hidden;
    padding: 24px 0;
  }

  /* ── 3-column row of layout cards — fluid scaling between desktop (760) and
     mobile (480). Gap and padding shrink with viewport so cards don't squish. ── */
  .layouts-grid {
    display: flex;
    gap: clamp(4px, calc(3.57vw - 23px), 14px);
    align-items: flex-start;
    padding: 0 clamp(16px, calc(11.43vw - 38.86px), 48px);
    position: relative;
  }

  .layout-card-wrap {
    flex: 1 0 0; min-width: 0;
    display: flex; align-items: flex-start;
    padding-top: 16px;
  }

  .layout-card {
    flex: 1 0 0; min-width: 0;
    position: relative;
    border-radius: 12px;
    overflow: visible;
    display: flex; flex-direction: column;
    opacity: 0; animation: mount 0.5s var(--spring) forwards;
    animation-delay: calc(var(--ai, 0) * 80ms);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .layout-card.best-fit {
    /* flex: 1 0 0 (matching .layout-card-wrap) — all 3 cards now equal width
       at every viewport. Previous clamp made best-fit a different (narrower)
       width than the wraps at intermediate viewport widths, which combined
       with aspect-ratio scaling on the slot made Tabbed's phone bottom drift
       above Chronological's mid-resize. Equal-width cards + slot aspect-ratio
       matching illustration's aspect-ratio (212/219) + slot margin-top: 16
       matching wrap pt-16 = slot bottom locked to illustration bottom at
       every viewport. Position: relative anchors the absolute crown. */
    flex: 1 0 0;
    min-width: 0;
    align-self: stretch;
    position: relative;
  }

  /* Best-fit pill — absolute-positioned at top-left of the card so it overlaps
     the slot's top WITHOUT consuming flow space. The slot then positions itself
     based on margin-top (not crown height), so phone+stroke bottoms align
     deterministically with Chronological/Nested phone bottoms at y=235. */
  .best-fit-crown {
    background: var(--accent); color: var(--canvas);
    padding: 8px 14px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.88px; text-transform: uppercase; line-height: 1.4;
    border: 1px solid var(--accent-hover);
    z-index: 2; white-space: nowrap;
    position: absolute;
    top: 0;
    left: 0;
  }

  /* ── Mock-UI illustration area (top of each card) ──
     Container holds the layout slot. Border-radius now lives on the IMG itself
     (with proportional clamp), so the phone's own corners are rounded and we
     don't get the partial-mask artifact from the container clipping the image. */
  .illustration {
    aspect-ratio: 212 / 219;
    padding: 24px 16px 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    opacity: 0.5;
  }
  .illustration img {
    width: 100%;
    aspect-ratio: 180 / 190;
    object-fit: cover;
    display: block;
    flex-shrink: 0;
    /* Proportional radius — TOP corners only (phone sinks into the card divider
       at the bottom, so bottom-left/right stay square). Ceiling 16 per global
       phone-screenshot rule; scales 6 → 16 with viewport. */
    border-radius: clamp(6px, calc(2vw + 2px), 16px) clamp(6px, calc(2vw + 2px), 16px) 0 0;
  }
  /* Tabbed (BEST FIT) — phone screenshot slot scales with best-fit card width.
     Aspect ratio 212/222 preserves Figma's slot shape; img inside has its own
     rounded mask (proportional clamp) so the phone's corners are clipped cleanly
     by the IMG itself, not the slot's border-radius. */
  .screenshot-slot {
    background: var(--surface-3);
    /* box-shadow: inset replaces border so the stroke doesn't consume content-box
       dimensions (border-box CSS would shrink content height by 2px). */
    box-shadow: inset 0 0 0 1px var(--accent-hover);
    border-radius: 12px;
    width: 100%;
    /* Aspect-ratio 212/219 matches .illustration's aspect-ratio EXACTLY so that
       at any card width, slot height = illustration height. Combined with
       margin-top: 16 (matching wrap pt-16), slot bottom = illustration bottom
       at every viewport width — alignment by construction, no fixed-pixel
       dependencies. (Figma renders slot at 212/222, +3px taller than
       illustration; we trade those 3px to gain viewport-scalable alignment.) */
    aspect-ratio: 212 / 219;
    margin-top: 16px;
    padding: 16px 16px 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    position: relative;
  }
  .screenshot-slot img {
    /* width: 100% (not 85%) — phone IMG fills slot's content box (180px) to
       match Chronological/Nested .illustration img (also 180px). All 3 phones
       same visual size; the Tabbed wrapper extends past the phone to form the
       "larger frame around best fit" visual per Figma. */
    width: 100%;
    aspect-ratio: 180 / 190;
    object-fit: cover;
    display: block;
    flex-shrink: 0;
    /* Top corners only — bottom is cut by the slot's bottom edge. Ceiling
       lowered from 18 to 16 per the global phone-screenshot rule. */
    border-radius: clamp(6px, calc(2vw + 2px), 16px) clamp(6px, calc(2vw + 2px), 16px) 0 0;
  }

  /* ── Card content: name + traits ── */
  .layout-divider {
    height: 1px; background: var(--border-normal);
  }
  .layout-content {
    padding: 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .layout-name {
    font-size: 12px; font-weight: 600; color: var(--text-pri);
    line-height: normal;
  }
  .trait {
    display: flex; gap: 6px; align-items: center;
    font-size: 9px; line-height: 1.3;
    color: var(--text-sec);
  }
  .trait-icon { width: 12px; height: 12px; flex-shrink: 0; }
  .trait.pro .trait-icon { color: var(--accent); }
  .trait.con .trait-icon { color: var(--red); }

  @keyframes mount {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile breakpoint — KEEP horizontal 3-up per Figma mobile (1409:2213).
     Cards stay in row, just smaller. Best-fit becomes flex (was fixed 212px). */
  @media (max-width: 480px) {
    body { padding: 16px; }
    .diagram { width: 100%; padding: 24px 0; }
    .layouts-grid {
      flex-direction: row;
      /* gap 12px (was 4px per Figma spec) — 4px reads as overlap on real
         iPhones because each card's full width includes the dark wrapper for
         Tabbed but only the phone for Chronological/Nested, so the visual edges
         collide. 12px gives proportional separation matching desktop's gap/card
         ratio. */
      gap: 12px;
      padding: 0 16px;
      align-items: flex-start;
    }
    .layout-card-wrap { padding-top: 16px; align-items: stretch; }
    .layout-card { flex: 1 1 0; }
    .layout-card.best-fit {
      flex: 1 1 0;
      align-self: stretch;
    }
    /* Illustration uses aspect-ratio at narrow so card heights scale together */
    .illustration { height: auto; aspect-ratio: 360/380; padding: 24px 16px 0; }
    .illustration img { width: 100%; height: 100%; }
    /* Best-fit screenshot slot fills card width. Aspect-ratio matches .illustration
       at mobile (360/380) so slot height equals illustration height, and
       margin-top: 16 matches .layout-card-wrap's pt-16 — guarantees slot bottom
       aligns with illustration bottom across all three cards. */
    .screenshot-slot { width: 100%; height: auto; aspect-ratio: 360/380; margin-top: 16px; padding: 16px 16px 0; }
    .screenshot-slot img { width: 100%; height: 100%; }
    .trait { gap: 4px; font-size: 8px; }
    .layout-content { padding: 10px; gap: 4px; }
    /* Tighten pill so there's a defined gap between BEST FIT bottom edge and
       phone screen top — was tangent at 6px padding. */
    .best-fit-crown { padding: 4px 10px; font-size: 9px; letter-spacing: 0.72px; line-height: 1.2; }
  }

  /* Embed mode */
  body.embedded { padding: 0; min-height: auto; display: block; background: transparent; overflow: hidden; }
  body.embedded .diagram { width: 100%; max-width: none; border-radius: 0; }
</style>
</head>
<body>
<div class="diagram">

  <div class="layouts-grid">

    <!-- ── Card 1 — Chronological ── -->
    <div class="layout-card-wrap" style="--ai:1">
      <div class="layout-card">
        <div class="illustration">
          <img src="assets/not12-chronological.png" alt="Chronological inbox layout phone mockup">
        </div>
        <div class="layout-divider"></div>
        <div class="layout-content">
          <p class="layout-name">Chronological</p>
          <div class="trait pro">
            <svg class="trait-icon" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5L4.75 8.75L9.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Flat IA is quick to scan and act</span>
          </div>
          <div class="trait con">
            <svg class="trait-icon" viewBox="0 0 12 12" fill="none"><path d="M3 3L9 9M9 3L3 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Mixing activity confuses users</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Card 2 — Nested ── -->
    <div class="layout-card-wrap" style="--ai:2">
      <div class="layout-card">
        <div class="illustration">
          <img src="assets/not12-nested.png" alt="Nested inbox layout phone mockup">
        </div>
        <div class="layout-divider"></div>
        <div class="layout-content">
          <p class="layout-name">Nested</p>
          <div class="trait pro">
            <svg class="trait-icon" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5L4.75 8.75L9.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Inline groups organize activity</span>
          </div>
          <div class="trait con">
            <svg class="trait-icon" viewBox="0 0 12 12" fill="none"><path d="M3 3L9 9M9 3L3 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Priority items can get buried in lists</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Card 3 — Tabbed (BEST FIT) ── -->
    <div class="layout-card best-fit" style="--ai:3">
      <div class="best-fit-crown">&#10003; Best Fit</div>
      <div class="screenshot-slot">
        <img src="assets/not12-tabbed.png" alt="Tabbed inbox layout phone mockup (best fit)">
      </div>
      <div class="layout-divider"></div>
      <div class="layout-content">
        <p class="layout-name">Tabbed</p>
        <div class="trait pro">
          <svg class="trait-icon" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5L4.75 8.75L9.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Separating groups organizes activity</span>
        </div>
        <div class="trait pro">
          <svg class="trait-icon" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5L4.75 8.75L9.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Tabs support quick scan &amp; action</span>
        </div>
      </div>
    </div>

  </div>

</div>
<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v2 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  // Respond to parent re-measure requests (fires on any iframe-width change)
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
