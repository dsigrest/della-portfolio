<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="figma-source" content="node:1513:361 page:29:42 file:TArUrZsBUocaAsqetjXq7V">
<title>Graceful degradation — above vs below threshold</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0A0C16;
    --card: #10121C;
    --elevated: #151722;
    --text-pri: #E0DFE4;
    --text-sec: rgba(224,223,228,0.6);
    --text-ter: rgba(224,223,228,0.4);
    --text-dim: rgba(224,223,228,0.2);
    --border-normal: rgba(224,223,228,0.07);
    --accent: #7FB5B0;
    --red: #C47878;
    /* Phone bezel token — matches ai-overview pattern */
    --phone-bg: #0E0F14;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08090F;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .diagram {
    width: 760px;
    background: var(--canvas);
    border-radius: 16px;
    padding: 24px 16px;
    overflow: hidden;
    position: relative;
  }

  /* Two-column comparison — matches diagram-ai-overview-v1 pattern */
  .comparison {
    display: flex;
    gap: 24px;
    align-items: stretch;
    width: 100%;
  }

  /* Each col: BEFORE has annotations LEFT + phone RIGHT (default row).
     AFTER reverses to phone LEFT + annotations RIGHT via row-reverse. */
  .col {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 16px;
  }
  .col.after {
    flex-direction: row-reverse;
  }

  /* Annotations column — flex-col, vertically centered against the phone */
  .annotations {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }

  /* Eyebrow — uppercase colored label per Figma 1513:368 / 1513:391.
     Della 2026-05-15: dropped white-space: nowrap so "BELOW THRESHOLD" /
     "ABOVE THRESHOLD" wrap to 2 lines at narrow widths instead of clipping. */
  .pill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.88px;
    text-transform: uppercase;
    line-height: 1.4;
    padding-left: 3px;
  }
  .pill.below { color: var(--red); }
  .pill.above { color: var(--accent); }

  /* Annotation row */
  .annotation {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 0;
  }
  .annotation .ann-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .annotation.below .ann-icon { color: var(--red); }
  .annotation.above .ann-icon { color: var(--accent); }
  .annotation .ann-icon svg { display: block; }
  .ann-title {
    font-size: 11px;
    font-weight: 600;
    line-height: normal;
    color: var(--text-pri);
  }

  /* Phone bezel — matches ai-overview pattern.
     aspect-ratio 1158/2532 matches the natural aspect of ui-source-posts.png
     and ui-reddit-answers-mobile.png so object-fit: cover doesn't crop. */
  .phone {
    flex: 1 1 0;
    min-width: 0;
    background: var(--phone-bg);
    border-radius: 16px;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 0 0 1px rgba(255,255,255,0.05),
      0 18px 40px rgba(0,0,0,0.45);
    align-self: start;
    aspect-ratio: 1158 / 2532;
  }
  .phone img.ui-screenshot {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 16px;
  }

  /* Embedded mode */
  body.embedded {
    padding: 0;
    background: transparent;
    min-height: auto;
    display: block;
    overflow: hidden;
  }
  body.embedded .diagram {
    width: 100%;
    border-radius: 0;
  }

  /* Responsive — tighten gap, stack on narrow */
  @media (max-width: 720px) {
    .comparison { gap: 16px; }
    .col { gap: 12px; }
  }
  @media (max-width: 480px) {
    .comparison { flex-direction: column; gap: 24px; }
    .col { gap: 16px; }
  }
</style>
</head>
<body>
  <div class="diagram">
    <div class="comparison">

      <!-- ===== BELOW THRESHOLD (left) — annotations LEFT, phone RIGHT ===== -->
      <div class="col">
        <div class="annotations">
          <div class="pill below">Below threshold</div>
          <div class="annotation below">
            <span class="ann-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                <line x1="4" y1="4" x2="12" y2="12"/>
                <line x1="12" y1="4" x2="4" y2="12"/>
              </svg>
            </span>
            <div class="ann-title">Synthesis suppressed &mdash; quality below confidence threshold</div>
          </div>
          <div class="annotation below">
            <span class="ann-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                <line x1="4" y1="4" x2="12" y2="12"/>
                <line x1="12" y1="4" x2="4" y2="12"/>
              </svg>
            </span>
            <div class="ann-title">Raw source posts surface as fallback</div>
          </div>
        </div>
        <div class="phone">
          <img class="ui-screenshot" src="../ui-source-posts.png" alt="Reddit threaded source posts mock — synthesis suppressed below confidence threshold, raw source posts surface as fallback" />
        </div>
      </div>

      <!-- ===== ABOVE THRESHOLD (right) — phone LEFT, annotations RIGHT via row-reverse ===== -->
      <div class="col after">
        <div class="annotations">
          <div class="pill above">Above threshold</div>
          <div class="annotation above">
            <span class="ann-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3.5,8.5 6.5,11.5 12.5,5"/>
              </svg>
            </span>
            <div class="ann-title">AI synthesis visible above fold with citations</div>
          </div>
          <div class="annotation above">
            <span class="ann-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3.5,8.5 6.5,11.5 12.5,5"/>
              </svg>
            </span>
            <div class="ann-title">Source posts available below</div>
          </div>
        </div>
        <div class="phone">
          <img class="ui-screenshot" src="../ui-reddit-answers-mobile.png" alt="Reddit Answers result page above confidence threshold — AI synthesis visible above fold with citations, source posts available below" />
        </div>
      </div>

    </div>
  </div>

<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v1 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
</html>
