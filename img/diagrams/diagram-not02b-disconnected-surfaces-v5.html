<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="figma-source" content="node:1170:766 page:29:43 file:TArUrZsBUocaAsqetjXq7V">
<title>NOT-02b — Disconnected surfaces</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0A0C16;
    --card: #10121C;
    --elevated: #151722;
    --text-pri: #E0DFE4;
    --text-sec: rgba(224,223,228,0.6);
    --text-ter: rgba(224,223,228,0.4);
    --text-dim: rgba(224,223,228,0.2);
    --border-normal: rgba(224,223,228,0.07);
    --accent: #7FB5B0;
    --accent-dim: rgba(127,181,176,0.12);
    --glass-bg: rgba(224,223,228,0.04);
    --glass-border: rgba(224,223,228,0.08);
    --glass-highlight: inset 0 1px 0 rgba(224,223,228,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--canvas);
    display: flex;
    justify-content: center;
    padding: 40px;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body.embedded { padding: 0; min-height: auto; display: block; background: transparent; overflow: hidden; }
  body.embedded .diagram { width: 100%; max-width: none; border-radius: 0; }

  .diagram {
    width: 100%;
    max-width: 760px;
    background: var(--canvas);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    padding: 24px 0;
    /* Query container — lets .comparison padding/gap scale with .diagram width.
       cqw on .comparison children resolves against this. */
    container-type: inline-size;
  }

  .comparison {
    /* Fluid scaling — at .diagram=760 the values resolve to Figma's 48/20;
       as the diagram shrinks toward 481 they ease down to 16/12 so the four
       columns get more breathing room and labels stay legible. Removed the
       28px top padding (not in Figma — outer .diagram py-24 handles top spacing). */
    padding: 0 clamp(16px, calc(8.9cqw - 19px), 48px);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(12px, calc(2.2cqw + 3.2px), 20px);
    align-items: start;
  }

  .col {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-width: 0;
    /* Establish a query container so .mock can size its border-radius
       proportionally to .col width (10.5cqw — see .mock rule below). */
    container-type: inline-size;
    opacity: 0;
    animation: fadeUp 0.6s ease-out forwards;
  }
  .col:nth-child(1) { animation-delay: 0.05s; }
  .col:nth-child(2) { animation-delay: 0.15s; }
  .col:nth-child(3) { animation-delay: 0.25s; }
  .col:nth-child(4) { animation-delay: 0.35s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .col-label {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    text-align: center;
    color: var(--accent);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1.2;
    /* Reserve 2 lines of vertical space so all 4 column labels share the same
       height — at narrow widths "PUSH NOTIFICATIONS" wraps to 2 lines while
       INBOX/CHAT stay 1 line. flex-end bottom-aligns each label to the phone
       above it, so phone tops align across all columns regardless of which
       labels wrapped. Phone-row vertical alignment is the legibility anchor. */
    min-height: 2.4em;
    margin-bottom: 24px;
  }

  .mock-frame {
    /* Side-padding scales with .col width (.col is the query container, set
       below). At desktop col≈151 this resolves to ~8px (Figma px-[8px]). At
       narrow cols the padding shrinks so the phone takes more of the column,
       keeping screenshots readable down to the mobile breakpoint. */
    padding: 0 clamp(4px, calc(5.6cqw - 0.5px), 8px);
    margin-bottom: 16px;
  }
  .mock {
    width: 100%;
    /* Phone-screenshot corner-radius — global rule per Della 2026-05-10:
       16 at desktop (vw=760), scales proportionally to ~8 at mobile (vw=375),
       6 floor. Was 10.5cqw which gave ~18-19px at desktop (too round). */
    border-radius: clamp(6px, 2.1vw, 16px);
    overflow: hidden;
    background: #000;
    aspect-ratio: 1040 / 2250;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .mock.push { aspect-ratio: 1206 / 2622; }
  .mock img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .col:hover .mock {
    transform: translateY(-2px);
  }

  /* Annotation block — plain text, no card chrome (matches Figma 1389:772 polish).
     Padding 7/10 matches Figma's px-[10px] py-[7px]. */
  .annotation {
    padding: 7px 10px;
    color: var(--text-sec);
    font-size: 11px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    overflow-wrap: break-word;
    word-break: break-word;
    min-width: 0;
  }
  .annotation ul {
    list-style: disc;
    padding-left: 16px;
    width: 100%;
    min-width: 0;
  }
  .annotation ul li {
    margin: 0;
    overflow-wrap: break-word;
  }
  .annotation p {
    overflow-wrap: break-word;
  }
  .annotation p {
    margin: 0;
    width: 100%;
  }

  /* Soft radial glow behind cards */
  .diagram::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center 40%, rgba(127,181,176,0.04), transparent 70%);
    pointer-events: none;
  }


  /* Mobile breakpoint — at ≤480px the 4-column comparison stacks into a 2x2 grid
     matching the Figma mobile frame (1381:263 at 375 width). Above 480px the
     4-column quad layout holds. Della's design intent: quad until 480, 2x2 below.
     Project-wide 480px default per references/breakpoint-conventions.md. */
  @media (max-width: 480px) {
    .comparison {
      grid-template-columns: 1fr 1fr;
      gap: 20px 16px;
      padding: 24px 16px 0;
    }
    .annotation {
      min-height: auto;
      padding: 9px 10px;
      word-break: normal;
      overflow-wrap: normal;
    }
    .annotation ul { padding-left: 14px; }
    .annotation ul li { overflow-wrap: normal; }
    .annotation p { overflow-wrap: normal; }
  }
</style>
</head>
<body>
<script>if(window!==window.parent)document.body.classList.add('embedded');</script>

<!-- diagram-height-poster v2 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  // Respond to parent re-measure requests (fires on any iframe-width change)
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
