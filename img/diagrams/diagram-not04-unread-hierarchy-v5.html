<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="figma-source" content="node:1396:540 file:TArUrZsBUocaAsqetjXq7V">
<title>NOT-04 v2 — Unread Hierarchy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0A0C16; --card: #10121C; --elevated: #151722;
    --text-pri: #E0DFE4; --text-sec: rgba(224,223,228,0.6); --text-ter: rgba(224,223,228,0.4); --text-dim: rgba(224,223,228,0.2);
    --border-normal: rgba(224,223,228,0.07);
    --accent: #7FB5B0; --accent-dim: rgba(127,181,176,0.2);
    --blue: #8A9EC4; --blue-dim: rgba(138,158,196,0.2);
    --gold: #C4B078; --gold-dim: rgba(196,176,120,0.2);
    --red: #C47878;
    --glass-bg: linear-gradient(141deg, rgba(224,223,228,0.05) 0%, rgba(224,223,228,0.016) 71%);
    --glass-border: rgba(224,223,228,0.08);
    --glass-highlight: inset 0 1px 0 rgba(224,223,228,0.06);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--canvas);
    display: flex;
    justify-content: center;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 24px;
  }

  body.embedded { padding: 0; min-height: auto; display: block; background: transparent; overflow: hidden; }
  body.embedded .diagram { width: 100%; max-width: none; border-radius: 0; }

  /* Frame standard: 24px top + 24px bottom across all diagrams */
  .diagram {
    width: 100%;
    max-width: 760px;
    background: var(--canvas);
    border-radius: 16px;
    overflow: hidden;
    padding: 24px 0;
  }

  /* Desktop: 3 cards horizontally; each card stacks icon-top, text-bottom */
  .levels-grid {
    padding: 0 16px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
  }

  .level-card {
    flex: 1 0 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    opacity: 0;
    animation: fadeUp 0.6s var(--spring) forwards;
  }
  .level-card.l1 { animation-delay: 0.05s; }
  .level-card.l2 { animation-delay: 0.18s; }
  .level-card.l3 { animation-delay: 0.31s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .illustration {
    width: 100%;
    height: 80px;
    min-height: 72px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 0 16px 0 32px;
  }

  .illustration img {
    display: block;
    object-fit: contain;
  }

  /* Per-image sizing from Figma (PNG dimensions) */
  .illustration .img-l1 { width: 40.907px; height: 40.907px; border-radius: 8px; }
  .illustration .img-l2 { width: 104.272px; height: 38.615px; border-radius: 8px; }
  .illustration .img-l3 { width: 117.333px; height: 61.308px; }

  .text-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-start;
    justify-content: center;
    padding: 0 32px;
  }

  .level-label {
    display: flex;
    gap: 8px;
    align-items: center;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
  }
  .level-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 400;
    line-height: 1;
    color: var(--accent);
  }
  .level-name {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-pri);
    line-height: 1;
  }

  .desc {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 400;
    line-height: 15px;
    color: var(--text-sec);
    width: 100%;
    /* Balance line breaks so all 3 cards' descriptions distribute words evenly
       across 2 lines (per Figma). L1 copy is 10 chars longer than L2/L3 — without
       balance it wraps to 3 lines while the others stay at 2. */
    text-wrap: balance;
  }

  /* Mobile: stack 3 cards vertically; each card lays out icon-LEFT, text-RIGHT.
     Threshold raised to 600 — at 481, three text columns clip "Location" / "Identify"
     labels and wrap descriptions into 1-word ladders. Same density problem as NOT-03. */
  @media (max-width: 600px) {
    .levels-grid {
      flex-direction: column;
      gap: 24px;
      padding: 0 16px;
    }
    .level-card {
      flex: 0 0 auto;
      width: 100%;
      flex-direction: row;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }
    .illustration {
      flex: 1 0 0;
      min-width: 0;
      height: auto;
      align-self: stretch;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
    }
    .text-wrap {
      flex: 1 0 0;
      min-width: 0;
      padding: 0;
    }
  }
</style>
</head>
<body>
<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
  <div class="diagram">
    <div class="levels-grid">

      <!-- Level 1: Count — inbox icon w/ badge -->
      <div class="level-card l1">
        <div class="illustration">
          <img class="img-l1" src="assets/not04-l1-inbox-badge.png" alt="">
        </div>
        <div class="text-wrap">
          <div class="level-label">
            <span class="level-num">1</span>
            <span class="level-name">Count</span>
          </div>
          <p class="desc">Aggregate count. User sees 4 and knows exactly how much activity</p>
        </div>
      </div>

      <!-- Level 2: Location — tabs w/ dot indicator -->
      <div class="level-card l2">
        <div class="illustration">
          <img class="img-l2" src="assets/not04-l2-tabs-dot.png" alt="">
        </div>
        <div class="text-wrap">
          <div class="level-label">
            <span class="level-num">2</span>
            <span class="level-name">Location</span>
          </div>
          <p class="desc">Boolean signal. The dot signals &ldquo;something&rsquo;s new here&rdquo;</p>
        </div>
      </div>

      <!-- Level 3: Identify — inbox rows w/ unread states -->
      <div class="level-card l3">
        <div class="illustration">
          <img class="img-l3" src="assets/not04-l3-inbox-rows.png" alt="">
        </div>
        <div class="text-wrap">
          <div class="level-label">
            <span class="level-num">3</span>
            <span class="level-name">Identify</span>
          </div>
          <p class="desc">Typographic + color shift. Items distinguished by weight and fill</p>
        </div>
      </div>

    </div>
  </div>
<!-- diagram-height-poster v2 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  // Respond to parent re-measure requests (fires on any iframe-width change)
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
</html>
