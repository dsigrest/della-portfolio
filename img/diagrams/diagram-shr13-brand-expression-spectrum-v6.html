<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="figma-source" content="node:1515:1693 page:29:41 file:TArUrZsBUocaAsqetjXq7V">
  <title>SHR-13 — Brand Expression Spectrum</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --canvas: #0A0C16;
      --card: #10121C;
      --elevated: #151722;
      --highest: #1A1C28;
      --text-pri: #E0DFE4;
      --text-sec: rgba(224,223,228,0.6);
      --text-ter: rgba(224,223,228,0.4);
      --text-dim: rgba(224,223,228,0.2);
      --border-normal: rgba(224,223,228,0.07);
      --accent: #7FB5B0;
      --accent-dim: rgba(127,181,176,0.12);
      --red: #C47878;
      --red-dim: rgba(196,120,120,0.12);
      --casual: #C4B078;
      --casual-dim: rgba(196,176,120,0.12);
      --new-seg: #8A9EC4;
      --new-seg-dim: rgba(138,158,196,0.12);
      --glass-bg: linear-gradient(135deg, rgba(224,223,228,0.05) 0%, rgba(224,223,228,0.015) 100%);
      --glass-border: rgba(224,223,228,0.08);
      --glass-highlight: inset 0 1px 0 rgba(224,223,228,0.06);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      background: #08090F;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--text-pri);
    }

    .diagram {
      max-width: 760px;
      width: 100%;
      background: transparent;
      border-radius: 16px;
      overflow: hidden;
      padding: 24px 48px;
    }

    .spectrum-area {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
    }

    /* Bar row — endpoint labels + gradient */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      opacity: 0;
      animation: fadeUp 600ms var(--spring) 100ms forwards;
    }
    .bar-label {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.3;
      flex-shrink: 0;
    }
    .bar-label.expression { color: var(--accent); }
    .bar-label.scalability { color: var(--red); }

    .track-bar {
      flex: 1;
      min-width: 0;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(
        90deg,
        var(--accent) 0%,
        var(--casual) 49%,
        var(--red) 100%
      );
    }

    /* Signal tag rows (top floats above bar, bottom floats below) */
    .signal-row {
      position: relative;
      width: 100%;
    }
    .signal-row--top    { height: 32px; padding-bottom: 18px; }
    .signal-row--bottom { height: 70px; padding-top: 8px; }

    .tag {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      border-radius: 8px;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
      white-space: normal;
      opacity: 0;
      transform: translateY(8px);
    }
    .tag .ann-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tag .ann-icon svg { width: 16px; height: 16px; display: block; }

    /* Resolution tag (center, above bar) — anchored at ~36% of inner width per Figma */
    .tag--resolution {
      top: -7px;
      left: 30.5%;
      color: var(--text-pri);
      max-width: 200px;
      animation: fadeUp 500ms var(--spring) 350ms forwards;
    }
    .tag--resolution .ann-icon { color: var(--casual); }

    /* Left rejected tag — pinned near Expression end (~2% of inner width per Figma) */
    .tag--rejected-left {
      top: 0;
      left: 2%;
      color: var(--text-sec);
      max-width: 140px;
      animation: fadeUp 500ms var(--spring) 500ms forwards;
    }
    .tag--rejected-left .ann-icon { color: var(--accent); }

    /* Right rejected tag — pinned near Scalability end (~63% of inner width per Figma) */
    .tag--rejected-right {
      top: -8px;
      left: 63%;
      color: var(--text-sec);
      max-width: 140px;
      animation: fadeUp 500ms var(--spring) 650ms forwards;
    }
    .tag--rejected-right .ann-icon { color: var(--red); }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile: stack labels above/below bar, tags become inline rows */
    @media (max-width: 480px) {
      .diagram { padding: 20px 24px; }
      .bar-row { gap: 12px; }
      .tag {
        position: static;
        max-width: 100%;
        left: auto;
        top: auto;
      }
      .signal-row--top, .signal-row--bottom {
        height: auto;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .signal-row--top    { margin-bottom: 18px; }
      .signal-row--bottom { margin-top: 16px; }
    }

    /* Embed mode: strip body chrome when loaded in iframe */
    body.embedded {
      padding: 0;
      min-height: auto;
      display: block;
      background: transparent;
      overflow: hidden;
      align-items: initial;
    }
    body.embedded .diagram {
      width: 100%;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div class="diagram">
    <div class="spectrum-area">

      <!-- TOP: resolution annotation (sits above bar) -->
      <div class="signal-row signal-row--top">
        <div class="tag tag--resolution">
          <span class="ann-icon">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>Consistent structure with targeted brand attribution</span>
        </div>
      </div>

      <!-- MIDDLE: gradient bar with endpoint labels -->
      <div class="bar-row">
        <span class="bar-label expression">Expression</span>
        <div class="track-bar" aria-hidden="true"></div>
        <span class="bar-label scalability">Scalability</span>
      </div>

      <!-- BOTTOM: two rejected approaches at the extremes -->
      <div class="signal-row signal-row--bottom">
        <div class="tag tag--rejected-left">
          <span class="ann-icon">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span>Anchor brand as focal point</span>
        </div>
        <div class="tag tag--rejected-right">
          <span class="ann-icon">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span>Locked into design system</span>
        </div>
      </div>

    </div>
  </div>

<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v1 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
</html>
