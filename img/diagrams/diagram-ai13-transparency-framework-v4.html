<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="figma-source" content="node:1481:576 page:29:42 file:TArUrZsBUocaAsqetjXq7V">
<title>First Precedent — Strategic Pillars</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0A0C16;
    --card: #10121C;
    --elevated: #151722;
    --text-pri: #E0DFE4;
    --text-sec: rgba(224,223,228,0.6);
    --text-ter: rgba(224,223,228,0.4);
    --text-dim: rgba(224,223,228,0.2);
    --border-normal: rgba(224,223,228,0.07);
    --accent: #7FB5B0;
    --accent-dim: rgba(127,181,176,0.12);
    --accent-bg: rgba(127,181,176,0.08);
    --accent-border: rgba(127,181,176,0.25);
    --casual: #D4A574;
    --new-seg: #8A9EC4;
    --red: #C47878;
    --glass-bg: linear-gradient(135deg, rgba(224,223,228,0.05) 0%, rgba(224,223,228,0.015) 100%);
    --glass-border: rgba(224,223,228,0.08);
    --glass-highlight: inset 0 1px 0 rgba(224,223,228,0.06);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #08090F;
    display: flex;
    justify-content: center;
    padding: 40px;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .diagram {
    width: 760px;
    background: transparent;   /* Della 2026-05-15: removed --card fill; sits directly on canvas in embed */
    border-radius: 16px;
    padding: 24px 16px;
    overflow: hidden;
    position: relative;
  }

  .pillars {
    display: flex;
    gap: 8px;
    align-items: stretch;
    width: 100%;
  }

  .pillar {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 0 12px;
    border-radius: 12px;
  }

  /* Circular icon zone — teal-tinted background + border (uniform across all 3 pillars per Figma) */
  .icon-zone {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-zone svg { display: block; }

  /* Animations stripped per Della — will polish in a follow-up pass */

  /* Title + description block */
  .pillar-content {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    text-align: center;
  }
  .pillar-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-pri);
    letter-spacing: -0.17px;
    line-height: normal;
  }
  .pillar-desc {
    font-size: 11px;
    color: var(--text-sec);
    line-height: 16px;
  }

  /* Embed mode */
  body.embedded {
    padding: 0;
    background: transparent;
    min-height: auto;
    display: block;
    overflow: hidden;
  }
  body.embedded .diagram {
    width: 100%;
    border-radius: 0;
  }

  /* Mobile @ 480px — Figma keeps 3-column at 375; just tighten gap slightly */
  @media (max-width: 480px) {
    .pillars { gap: 4px; }
    .pillar { padding: 0 8px; gap: 16px; }
    .pillar-name { font-size: 13px; }
    .pillar-desc { font-size: 10px; line-height: 14px; }
  }
</style>
</head>
<body>
  <div class="diagram">
    <div class="pillars">

      <!-- Identification — eye -->
      <div class="pillar">
        <div class="icon-zone">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <ellipse cx="14" cy="14" rx="11" ry="7" stroke="var(--accent)" stroke-width="1.4" fill="none"/>
            <circle cx="14" cy="14" r="3.5" fill="var(--accent)"/>
          </svg>
        </div>
        <div class="pillar-content">
          <div class="pillar-name">Identification</div>
          <div class="pillar-desc">Scalable, instantly recognizable signal that content was AI-generated</div>
        </div>
      </div>

      <!-- Content — component library / stacked elements -->
      <div class="pillar">
        <div class="icon-zone">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <rect x="4" y="6" width="17" height="4" rx="1.5" stroke="var(--accent)" stroke-width="1.2" fill="var(--accent-bg)"/>
            <rect x="4" y="12" width="13" height="4" rx="1.5" stroke="var(--accent)" stroke-width="1.2" fill="var(--accent-bg)"/>
            <rect x="4" y="18" width="10" height="4" rx="1.5" stroke="var(--accent)" stroke-width="1.2" fill="var(--accent-bg)"/>
          </svg>
        </div>
        <div class="pillar-content">
          <div class="pillar-name">Content</div>
          <div class="pillar-desc">Component library, identification, and feedback UI as reusable system components</div>
        </div>
      </div>

      <!-- Quality — diamond -->
      <div class="pillar">
        <div class="icon-zone">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path d="M 14 4 L 24 12 L 14 24 L 4 12 Z" stroke="var(--accent)" stroke-width="1.4" fill="var(--accent-bg)" stroke-linejoin="round"/>
            <path d="M 9 8 L 14 12 L 19 8" stroke="var(--accent)" stroke-width="0.9" fill="none" opacity="0.5"/>
            <path d="M 4 12 L 14 12 L 24 12" stroke="var(--accent)" stroke-width="0.9" fill="none" opacity="0.5"/>
            <path d="M 14 12 L 14 24" stroke="var(--accent)" stroke-width="0.9" fill="none" opacity="0.4"/>
          </svg>
        </div>
        <div class="pillar-content">
          <div class="pillar-name">Quality</div>
          <div class="pillar-desc">Ensuring users understand posts below are sources for the summary above</div>
        </div>
      </div>

    </div>
  </div>

<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v1 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
</html>
