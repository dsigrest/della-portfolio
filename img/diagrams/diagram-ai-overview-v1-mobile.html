<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="figma-source" content="node:1411:4671 page:29:42 file:TArUrZsBUocaAsqetjXq7V">
<title>Reddit Answers — Page Overview (mobile, Search Results Before vs After)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0A0C16;
    --card: #10121C;
    --text-pri: #E0DFE4;
    --text-sec: rgba(224,223,228,0.6);
    --text-ter: rgba(224,223,228,0.4);
    --text-dim: rgba(224,223,228,0.30);
    --red: #C47878;
    --accent: #7FB5B0;
    --border-normal: rgba(224,223,228,0.07);
    /* Phone UI mock tokens */
    --phone-bg: #0E0F14;
    --phone-text-pri: #F2F2F2;
    --phone-text-sec: rgba(255,255,255,0.65);
    --phone-text-ter: rgba(255,255,255,0.45);
    --phone-divider: rgba(255,255,255,0.07);
    --reddit-orange: #FF4500;
    --google-blue: #8AB4F8;
    --tab-active: #8AB4F8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08090F;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .diagram {
    width: 375px;
    background: var(--canvas);
    border-radius: 16px;
    padding: 24px 16px;
    position: relative;
    overflow: hidden;
  }

  /* Two sections STACKED vertically on mobile (Figma .comparison is flex-col here) */
  .comparison {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: 100%;
  }

  /* Each section: annotations LEFT, phone RIGHT (BEFORE)
     AFTER reverses: phone LEFT, annotations RIGHT (sandwiched per Figma) */
  .col {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 16px;
    width: 100%;
  }
  .col.after {
    flex-direction: row-reverse;
  }

  .annotations {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }

  .pill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.88px;
    text-transform: uppercase;
    line-height: 1.4;
    padding-left: 3px;
    white-space: nowrap;
  }
  .pill.below { color: var(--red); }
  .pill.above { color: var(--accent); }

  .annotation {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 0;
  }
  .annotation .ann-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .annotation .ann-icon svg { display: block; }
  .annotation.below .ann-icon { color: var(--red); }
  .annotation.above .ann-icon { color: var(--accent); }
  .ann-title {
    font-size: 11px;
    font-weight: 600;
    line-height: normal;
    color: var(--text-pri);
  }

  /* Phone bezel */
  .phone {
    flex: 1 1 0;
    min-width: 0;
    background: var(--phone-bg);
    border-radius: 16px;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 0 0 1px rgba(255,255,255,0.05),
      0 14px 32px rgba(0,0,0,0.45);
    align-self: start;
    aspect-ratio: 1158 / 2532;
  }
  .phone img.ui-screenshot {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 16px;
  }

  /* Embedded mode */
  body.embedded {
    padding: 0;
    background: transparent;
    min-height: auto;
    display: block;
  }
  body.embedded .diagram {
    width: 100%;
    border-radius: 0;
  }
</style>
</head>
<body>
  <div class="diagram">
    <div class="comparison">

      <!-- ===== BEFORE ===== -->
      <div class="col">
        <div class="annotations">
          <div class="pill below">Before</div>
          <div class="annotation below">
            <span class="ann-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                <line x1="4" y1="4" x2="12" y2="12"/>
                <line x1="12" y1="4" x2="4" y2="12"/>
              </svg>
            </span>
            <div class="ann-title">Multiple links compete to rank</div>
          </div>
          <div class="annotation below">
            <span class="ann-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                <line x1="4" y1="4" x2="12" y2="12"/>
                <line x1="12" y1="4" x2="4" y2="12"/>
              </svg>
            </span>
            <div class="ann-title">User bounces in search of answer</div>
          </div>
        </div>
        <div class="phone">
          <img class="ui-screenshot" src="../ui-overview-below.png" alt="Google search results page for 'best sunscreen 2024' showing three reddit.com result cards — multiple links compete to rank, user bounces in search of answer" />
        </div>
      </div>

      <!-- ===== AFTER — flipped: phone LEFT, annotations RIGHT ===== -->
      <div class="col after">
        <div class="annotations">
          <div class="pill above">After</div>
          <div class="annotation above">
            <span class="ann-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3.5,8.5 6.5,11.5 12.5,5"/>
              </svg>
            </span>
            <div class="ann-title">Single link consolidates information</div>
          </div>
          <div class="annotation above">
            <span class="ann-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3.5,8.5 6.5,11.5 12.5,5"/>
              </svg>
            </span>
            <div class="ann-title">User discovers answer on platform</div>
          </div>
        </div>
        <div class="phone">
          <img class="ui-screenshot" src="../ui-overview-above.png" alt="Google search results page for 'best sunscreen 2024' showing Reddit Answers AI-synthesis card above fold with cited source posts and a Consumer Reports linked reference — single link consolidates information, user discovers answer on platform" />
        </div>
      </div>

    </div>
  </div>

<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v1 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
</html>
