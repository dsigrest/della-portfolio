<style>
  :root {
    --canvas: #0A0C16;

    --glass-border: rgba(224,223,228,0.08);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08090F;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text-pri);
  }
  .diagram {
    width: 100%;
    max-width: 760px;
    background: transparent;
    border-radius: 16px;
    overflow: hidden;
    padding: 24px 0;
  }

  .composition {
    display: flex;
    gap: 16px;
    align-items: stretch;
    justify-content: center;
    width: 100%;
    padding: 0 48px;
  }

  /* Phone on left — uses GIF aspect 800/1739 ≈ 0.46 */
  .phone-frame {
    width: 178px;
    aspect-ratio: 800 / 1739;
    border-radius: 16px;
    overflow: hidden;
    flex-shrink: 0;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 600ms var(--spring) 400ms forwards;
  }
  .phone-gif {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    border-radius: 16px;
  }
  .phone-placeholder {
    width: 100%;
    height: 100%;
    border-radius: 16px;
    background:
      repeating-linear-gradient(
        45deg,
        rgba(224,223,228,0.04),
        rgba(224,223,228,0.04) 10px,
        rgba(224,223,228,0.015) 10px,
        rgba(224,223,228,0.015) 20px
      );
    border: 1px dashed rgba(224,223,228,0.12);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    gap: 6px;
  }
  .placeholder-label { font-family: 'Inter', sans-serif; font-size: 10px; color: var(--text-sec); line-height: 1.4; }
  .placeholder-path { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-ter); line-height: 1.5; word-break: break-all; }

  /* Annotations on right */
  .annotations {
    flex: 1;
    max-width: 280px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    justify-content: center;
    overflow: hidden;
  }
  .col-label {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-left: 3px;
    color: var(--accent);
    opacity: 0;
    animation: fadeUp 500ms var(--spring) 200ms forwards;
  }
  .annotation {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 9px 0;
    border-radius: 10px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(8px);
  }
  .annotation.a1 { animation: fadeUp 500ms var(--spring) 500ms forwards; }
  .annotation.a2 { animation: fadeUp 500ms var(--spring) 580ms forwards; }
  .annotation.a3 { animation: fadeUp 500ms var(--spring) 660ms forwards; }

  .ann-icon { width: 16px; height: 16px; flex-shrink: 0; color: var(--accent); }
  .ann-icon svg { width: 16px; height: 16px; display: block; }
  .ann-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .ann-label { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; line-height: 1.3; color: var(--text-pri); }
  .ann-text { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 400; line-height: 1.4; color: var(--text-ter); }

  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 480px) {
    .diagram { padding: 20px 0; }
    .composition { flex-direction: column; gap: 24px; padding: 0 24px; align-items: center; }
    .phone-frame { width: 200px; }
    .annotations { max-width: 100%; width: 100%; }
  }

  body.embedded {
    padding: 0; min-height: auto; display: block;
    background: transparent; overflow: hidden; align-items: initial;
  }
  body.embedded .diagram { width: 100%; border-radius: 0; }
</style>

<!-- diagram-height-poster v1 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
