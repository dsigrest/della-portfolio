<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="figma-source" content="node:1516:1893 page:29:41 file:TArUrZsBUocaAsqetjXq7V">
  <title>SHR-E1 — Result Cycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --canvas: #0A0C16;
      --card: #10121C;
      --elevated: #151722;
      --highest: #1A1C28;
      --text-pri: #E0DFE4;
      --text-sec: rgba(224,223,228,0.6);
      --text-ter: rgba(224,223,228,0.4);
      --text-dim: rgba(224,223,228,0.2);
      --border-normal: rgba(224,223,228,0.07);
      --accent: #7FB5B0;
      --accent-dim: rgba(127,181,176,0.12);
      --red: #C47878;
      --casual: #C4B078;
      --new-seg: #8A9EC4;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      background: #08090F;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--text-pri);
    }

    .diagram {
      max-width: 760px;
      width: 100%;
      background: transparent;
      border-radius: 16px;
      overflow: hidden;
      padding: 24px 48px;
    }

    /* Three-step row */
    .cycle-row {
      display: flex;
      align-items: flex-start;
      width: 100%;
    }

    .step {
      flex: 1;
      min-width: 0;
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(12px);
    }
    .step.s1 { animation: fadeUp 600ms var(--spring) 200ms forwards; }
    .step.s2 { animation: fadeUp 600ms var(--spring) 400ms forwards; }
    .step.s3 { animation: fadeUp 600ms var(--spring) 600ms forwards; }

    .step-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .step-icon svg { width: 32px; height: 32px; display: block; }
    .step.s1 .step-icon { color: var(--casual); }
    .step.s2 .step-icon { color: var(--text-pri); }
    .step.s3 .step-icon { color: var(--new-seg); }

    .step-title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--text-pri);
      text-align: center;
      margin-bottom: 4px;
    }
    .step-desc {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.4;
      color: var(--text-sec);
      text-align: center;
      max-width: 145px;
    }

    /* Connector arrow between steps */
    .connector {
      flex-shrink: 0;
      align-self: center;
      margin-top: 12px;
      opacity: 0;
      animation: fadeIn 400ms ease-out forwards;
    }
    .connector.c12 { animation-delay: 300ms; }
    .connector.c23 { animation-delay: 500ms; }
    .connector svg {
      width: 50px;
      height: 8px;
      display: block;
      color: var(--text-dim);
    }

    /* Return loop arc */
    .return-loop {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px 0 30px;
      width: 100%;
      opacity: 0;
      animation: fadeUp 600ms var(--spring) 850ms forwards;
    }
    .return-arc {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      height: 8px;
    }
    .return-arc svg {
      width: 100%;
      height: 8px;
      display: block;
      color: var(--text-dim);
    }
    .return-label {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-ter);
      white-space: nowrap;
      flex-shrink: 0;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Mobile: stack the 3 steps vertically with downward connectors */
    @media (max-width: 480px) {
      .diagram { padding: 24px 16px; }
      .cycle-row { flex-direction: column; align-items: stretch; gap: 8px; }
      .step { padding: 0; }
      .connector { transform: rotate(90deg); margin: 4px auto; }
      .return-loop { padding: 16px 0 0; flex-direction: column-reverse; gap: 8px; }
      .return-arc { width: 100%; }
      .return-label { white-space: normal; text-align: center; }
    }

    /* Embed mode: strip body chrome when loaded in iframe */
    body.embedded {
      padding: 0;
      min-height: auto;
      display: block;
      background: transparent;
      overflow: hidden;
      align-items: initial;
    }
    body.embedded .diagram {
      width: 100%;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div class="diagram">

    <div class="cycle-row">

      <!-- Step 1: SHARE (gold curved arrow) -->
      <div class="step s1">

      <div class="step s2">

            <path d="M12 15V8a2 2 0 014 0v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M16 12V10a2 2 0 014 0v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M20 12.5V11a2 2 0 014 0v9c0 3.5-2.5 7-7 7-4 0-6.5-2.5-7.5-5.5L7 15c-.5-1.4.5-2.5 1.8-2.5 1 0 1.5.6 1.7 1.2L12 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M11 4l-1.5 1.5M21 4l1.5 1.5M16 2v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
          </svg>
        </div>
        <div class="step-title">Engage</div>

      <!-- Connector 2→3 -->
      <div class="connector c23">

          <polyline points="40,1 47,4 40,7" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Step 3: TRUST (heart, blue) -->
      <div class="step s3">
        <div class="step-icon">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M16 27S4 19 4 12a6 6 0 0112-2 6 6 0 0112 2c0 7-12 15-12 15z" fill="currentColor"/>
          </svg>
        </div>
        <div class="step-title">Trust</div>
        <div class="step-desc">&hellip;</div>
      </div>

    </div>

    <!-- Return loop: arrow pointing left + label -->
    <div class="return-loop">
      <div class="return-arc">
        <svg viewBox="0 0 700 8" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <line x1="10" y1="4" x2="700" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" preserveAspectRatio="none"/>
          <polyline points="14,1 7,4 14,7" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="return-label">&#8634; Trust fuels more sharing</div>
    </div>

  </div>

<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v1 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
