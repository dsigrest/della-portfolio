<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="figma-source" content="node:1481:86 page:29:42 file:TArUrZsBUocaAsqetjXq7V">
<title>Graceful degradation (mobile) — above vs below threshold</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0A0C16;
    --card: #10121C;
    --accent: #7FB5B0;
    --red: #C47878;
    --text-pri: #E0DFE4;
    --text-sec: rgba(224,223,228,0.6);
    --text-ter: rgba(224,223,228,0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08090F;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .diagram {
    width: 760px;
    background: var(--canvas);
    border-radius: 16px;
    padding: 24px 48px;
  }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 16px 20px;
    align-items: start;
  }

  /* Subgrid so labels / shots / annotations line up across the divider */
  .column {
    display: grid;
    grid-template-rows: subgrid;
    grid-row: span 3;
    gap: 16px;
  }

  /* Centered text label at top of each column */
  .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.88px;
    text-transform: uppercase;
    line-height: 1.4;
    text-align: center;
    width: 100%;
  }
  .label.above { color: var(--accent); }
  .label.below { color: var(--red); }

  /* Phone screenshot — full natural aspect, rounded corners */
  .shot {
    width: 100%;
    padding: 0 8px;
  }
  .shot img.ui-screenshot {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 16px;
  }

  /* Annotation bullets below each shot */
  .annotations {
    padding: 7px 10px;
    border-radius: 8px;
  }
  .annotations ul {
    list-style: disc;
    padding-left: 16.5px;
    margin: 0;
  }
  .annotations li {
    font-size: 11px;
    font-weight: 400;
    line-height: 1.4;
    color: var(--text-sec);
  }
  .annotations li + li { margin-top: 2px; }

  /* Narrow viewports: tighten gaps but keep two columns side-by-side until very narrow */
  @media (max-width: 720px) {
    .diagram { padding: 20px 16px; }
    .columns { gap: 12px 12px; }
  }
  @media (max-width: 480px) {
    .diagram { padding: 16px 8px; }
    .columns { gap: 10px 8px; }
    .annotations { padding: 6px 4px; }
    .annotations li { font-size: 10px; }
  }
  /* Only stack on the narrowest phones */
  @media (max-width: 400px) {
    .columns { grid-template-columns: 1fr; grid-template-rows: none; gap: 24px; }
    .column { grid-template-rows: auto; grid-row: auto; display: flex; flex-direction: column; gap: 12px; }
  }

  /* Embedded mode */
  body.embedded {
    padding: 0;
    background: transparent;
    min-height: auto;
    display: block;
  }
  body.embedded .diagram {
    width: 100%;
    border-radius: 0;
  }
</style>
</head>
<body>
  <div class="diagram">
    <div class="columns">

      <!-- ===== ABOVE THRESHOLD — left ===== -->
      <div class="column above">
        <p class="label above">Above threshold</p>
        <div class="shot">
          <img class="ui-screenshot" src="../ui-reddit-answers-mobile.png" alt="Reddit Answers mobile — AI synthesis surfaced above fold with citations and source posts available below" />
        </div>
        <div class="annotations">
          <ul>
            <li>AI synthesis visible above fold with citations</li>
            <li>Source posts available below</li>
          </ul>
        </div>
      </div>

      <!-- ===== BELOW THRESHOLD — right ===== -->
      <div class="column below">
        <p class="label below">Below threshold</p>
        <div class="shot">
          <img class="ui-screenshot" src="../ui-source-posts.png" alt="Reddit threaded source posts mobile — synthesis suppressed when confidence is too low; raw source posts surface as fallback" />
        </div>
        <div class="annotations">
          <ul>
            <li>Synthesis suppressed — quality below confidence threshold</li>
            <li>Raw source posts surface as fallback</li>
          </ul>
        </div>
      </div>

    </div>
  </div>

<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v1 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
</html>
