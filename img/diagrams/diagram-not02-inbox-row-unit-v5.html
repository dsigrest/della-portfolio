<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="figma-source" content="node:1393:312 page:1214:13477 file:TArUrZsBUocaAsqetjXq7V">
<title>NOT-02 — Inbox Row Component: One-off Elements vs Scalable Component</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0A0C16;
    --card: #10121C;
    --elevated: #151722;
    --highest: #1A1C28;
    --text-pri: #E0DFE4;
    --text-sec: rgba(224,223,228,0.6);
    --text-ter: rgba(224,223,228,0.4);
    --text-dim: rgba(224,223,228,0.2);
    --border-normal: rgba(224,223,228,0.07);
    --accent: #7FB5B0;
    --accent-dim: rgba(127,181,176,0.12);
    --accent-15: rgba(127,181,176,0.15);
    --red: #C47878;
    --red-dim: rgba(196,120,120,0.12);
    --red-15: rgba(196,120,120,0.15);
    --glass-bg: linear-gradient(135deg, rgba(224,223,228,0.05) 0%, rgba(224,223,228,0.015) 100%);
    --glass-border: rgba(224,223,228,0.08);
    --glass-highlight: inset 0 1px 0 rgba(224,223,228,0.06);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--canvas);
    display: flex;
    justify-content: center;
    padding: 40px;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .diagram {
    width: 100%;
    max-width: 760px;
    background: var(--canvas);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 24px 0;
  }

  /* ── Hover hint (top) — preserved from prior version (unused in current layout) ── */
  .hover-hint-wrap {
    padding: 20px 48px 0;
    display: flex;
    justify-content: center;
  }
  .hover-hint {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ── Comparison ── */
  .comparison-wrap {
    padding: 0 48px;
  }
  .comparison {
    display: grid;
    /* minmax(0, 1fr) ensures BEFORE and AFTER cols stay equal-width regardless
     of content intrinsic min-width — without the 0 floor, image content can
     force one col wider than the other. */
    grid-template-columns: minmax(0, 1fr) 45px minmax(0, 1fr);
    gap: 20px;
    align-items: stretch;
  }
  .col {
    display: flex;
    flex-direction: column;
    /* Figma desktop uses gap-32 between label and stack; mobile uses gap-16.
       Container-type lets row-mocks scale their corner-radius proportionally
       to .col width via cqw clamps below. min-width: 0 allows the col to
       shrink below content intrinsic width so 1fr distribution holds. */
    gap: 32px;
    min-width: 0;
    container-type: inline-size;
  }

  .col-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    line-height: 1.4;
    width: 100%;
  }
  .col-label.before { color: var(--red); }
  .col-label.after { color: var(--accent); }
  .col-label .ann-icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── BEFORE column: stacked row mocks ── */
  .row-stack {
    display: flex;
    flex-direction: column;
    gap: 16px;
    justify-content: center;
    flex: 1;
  }
  .row-mock {
    width: 100%;
    overflow: hidden;
    border: 1px solid rgba(224,223,228,0.04);
    background: #F6F6F6;
    position: relative;
  }
  /* Row-mocks use each PNG's natural aspect-ratio so content isn't cropped.
     Widths match the atom-row (via equal-width cols), so all four row units
     scale together as the diagram resizes — same width, each at its own height.
     Corner-radius scales with .col width: 14/16/16 desktop → 4 at mobile. */
  .row-mock.row-1 { aspect-ratio: 579 / 158; border-radius: clamp(4px, calc(7.2cqw - 6.79px), 14px); }
  .row-mock.row-2 { aspect-ratio: 579 / 124; border-radius: clamp(4px, calc(8.63cqw - 8.94px), 16px); }
  .row-mock.row-3 { aspect-ratio: 579 / 116; border-radius: clamp(4px, calc(8.63cqw - 8.94px), 16px); border-width: 2px; }

  /* Image fills wrapper at its natural aspect — no positioning offsets needed
     because the PNG files are already the row strips themselves. */
  .row-mock img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ── Arrow column (between before/after) ── */
  .arrow-col {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-ter);
    /* Shift the arrow's vertical center down to match where the row-stack /
       atom-stack actually center. Without this, the arrow centers on the full
       col height (which includes the label + col gap above the stack). The
       offset = label height (11px * 1.4 line) + col gap (32px) = 47.4px. */
    padding-top: calc(11px * 1.4 + 32px);
  }
  .arrow-col svg {
    width: 45px;
    height: auto;
    display: block;
  }

  /* ── AFTER column: deconstructed wireframe atoms ── */
  .col.after {
    justify-content: center;
  }
  .atom-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    height: 224px;
    padding: 0;
    flex: 1;
  }
  .atom {
    background: var(--card);
    border: 0.758px solid rgba(224,223,228,0.1);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--text-pri);
    font-size: 9.86px;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.0986px;
    line-height: 1;
  }
  .atom.atom-overflow {
    width: 22.2px;
    height: 29px;
    padding: 9px 10px;
  }
  .atom.atom-overflow .dots {
    display: flex;
    flex-direction: column;
    gap: 2.2px;
  }
  .atom.atom-overflow .dots span {
    width: 2.2px;
    height: 2.2px;
    border-radius: 50%;
    background: var(--text-pri);
    display: block;
  }
  .atom.atom-pill {
    padding: 6.068px 12.135px;
    gap: 6.068px;
    height: 24.135px;
  }
  .atom.atom-pill .chev {
    width: 4px;
    height: 8px;
    flex-shrink: 0;
  }
  .atom.atom-row {
    width: 100%;
    aspect-ratio: 579 / 105;
    background: transparent;
    border: 0;
    border-radius: 0;
    overflow: visible;
    padding: 0;
    align-self: stretch;
  }
  .atom.atom-row img {
    width: 100%;
    height: auto;
    display: block;
  }
  .atom.atom-icon-btn {
    width: 29px;
    height: 25.135px;
    padding: 0;
  }
  .atom.atom-icon-btn svg {
    width: 13px;
    height: 13px;
  }

  /* ── Annotations — preserved class definitions; element nodes are intentionally absent in this layout ── */
  .annotations {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .annotation {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    transition: background 0.25s ease, opacity 0.25s ease, transform 0.35s var(--spring);
    cursor: default;
  }
  .annotation.problem { color: var(--red); }
  .annotation.solution { color: var(--accent); }

  /* ── Load animations ── */
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hover-hint-wrap {
    animation: fadeSlideIn 0.5s ease-out 0ms forwards;
  }
  .col.before {
    animation: fadeSlideIn 0.5s ease-out 120ms forwards;
    opacity: 0;
  }
  .col.after {
    animation: fadeSlideIn 0.5s ease-out 180ms forwards;
    opacity: 0;
  }

  /* ── Mobile fit ── */
  /* 768–481: tighten outer padding so cols get more room */
  @media (max-width: 768px) {
    body { padding: 16px; }
    .diagram { padding: 20px 0; }
    .comparison-wrap { padding: 0 24px; }
    .comparison { gap: 16px; grid-template-columns: 1fr 32px 1fr; }
    .arrow-col svg { width: 28px; }
  }
  /* 480 and below: compress to mobile layout. Cols are EQUAL widths
     (minmax(0,1fr) each) so left cards and right scalable component render at
     the same width — matching Della's intent that they scale consistently
     together. Col gap drops from 32 to 16; atom-stack gap to 12. */
  @media (max-width: 480px) {
    body { padding: 12px; }
    .diagram { padding: 16px 0; }
    .comparison-wrap { padding: 0 16px; }
    .comparison {
      grid-template-columns: minmax(0,1fr) 21px minmax(0,1fr);
      gap: 4px;
      align-items: stretch;
    }
    .col { gap: 16px; }
    .row-stack { gap: 8px; }
    .col-label { font-size: 10px; letter-spacing: 0.06em; gap: 2px; }
    .col-label .ann-icon { width: 14px; height: 14px; }
    .arrow-col svg { width: 17px; }
    .atom-stack { gap: 12px; height: auto; min-height: 180px; }
    .atom.atom-pill { font-size: 9px; padding: 5px 10px; height: 22px; }
    .atom.atom-overflow { width: 20px; height: 26px; }
    .atom.atom-icon-btn { width: 26px; height: 22px; }
  }

  /* ── Embed mode ── */
  body.embedded {
    padding: 0;
    background: transparent;
    min-height: auto;
    display: block;
  }
  body.embedded .diagram {
    width: 100%;
    max-width: none;
    border-radius: 0;
  }
</style>
</head>
<body>
<div class="diagram" data-diagram-id="not02">

  <!-- Comparison -->
  <div class="comparison-wrap">
    <div class="comparison">

      <!-- ── BEFORE: stacked legacy notification rows ── -->
      <div class="col before">
        <div class="col-label before">

      <div class="col after">

            <img src="assets/not02-unified-row.png" alt="Unified inbox row component skeleton showing avatar, title, body, timestamp, and preview thumbnail" width="579" height="105">

              <circle cx="4.5" cy="4.5" r="1" fill="currentColor" opacity="0.6"/>
              <path d="M2 10l3-3 2.5 2.5L10 7l2 2v1.5H2V10z" fill="currentColor" opacity="0.6"/>
            </svg>

      </div>

    </div>
  </div>

</div>

<!-- diagram-height-poster v2 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  // Respond to parent re-measure requests (fires on any iframe-width change)
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
