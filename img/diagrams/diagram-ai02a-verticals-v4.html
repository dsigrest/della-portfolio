<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="figma-source" content="node:1203:5467 page:29:42 file:TArUrZsBUocaAsqetjXq7V">
<title>Static MVP Methodology</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #0A0C16;
    --card: #10121C;
    --elevated: #151722;
    --text-pri: #E0DFE4;
    --text-sec: rgba(224,223,228,0.6);
    --text-ter: rgba(224,223,228,0.4);
    --text-dim: rgba(224,223,228,0.2);
    --border-normal: rgba(224,223,228,0.07);
    --accent: #7FB5B0;
    --accent-dim: rgba(127,181,176,0.12);
    --casual: #D4A574;
    --new-seg: #8A9EC4;
    --red: #C47878;
    --glass-bg: linear-gradient(135deg, rgba(224,223,228,0.05) 0%, rgba(224,223,228,0.015) 100%);
    --glass-border: rgba(224,223,228,0.08);
    --glass-highlight: inset 0 1px 0 rgba(224,223,228,0.06);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #08090F;
    display: flex;
    justify-content: center;
    padding: 40px;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .diagram {
    width: 760px;
    background: var(--canvas);
    border-radius: 16px;
    padding: 24px 0;
    overflow: hidden;
    position: relative;
  }

  .verticals-area {
    padding: 0 48px;
    width: 100%;
  }

  .verticals-grid {
    display: flex;
    gap: 24px;
    align-items: start;
    width: 100%;
  }

  .vertical {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 12px;
  }

  /* Icon containers */
  .vertical-icon {
    width: 96px;
    height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 8px;
  }
  .vertical.step-gen .vertical-icon { width: 100px; height: 96px; }

  /* ── DATA AUDIT: 5×3 pixel grid — each lights up then fades, independent timing ── */
  .step-data .pixel-grid {
    display: grid;
    grid-template-columns: repeat(5, 6px);
    grid-template-rows: repeat(3, 6px);
    gap: 3px;
  }
  .step-data .px {
    width: 6px; height: 6px;
    border-radius: 1px;
    background: var(--casual);
    opacity: 0.2;
    animation: pixel-blink 5s linear infinite;
  }
  /* Sparse staggered delays — only 1–2 pixels lit at any time over 5s cycle */
  .step-data .px:nth-child(1)  { animation-delay: 0.10s; }
  .step-data .px:nth-child(2)  { animation-delay: 3.55s; }
  .step-data .px:nth-child(3)  { animation-delay: 1.30s; }
  .step-data .px:nth-child(4)  { animation-delay: 4.65s; }
  .step-data .px:nth-child(5)  { animation-delay: 0.55s; }
  .step-data .px:nth-child(6)  { animation-delay: 2.40s; }
  .step-data .px:nth-child(7)  { animation-delay: 1.85s; }
  .step-data .px:nth-child(8)  { animation-delay: 4.20s; }
  .step-data .px:nth-child(9)  { animation-delay: 0.95s; }
  .step-data .px:nth-child(10) { animation-delay: 3.10s; }
  .step-data .px:nth-child(11) { animation-delay: 1.65s; }
  .step-data .px:nth-child(12) { animation-delay: 4.45s; }
  .step-data .px:nth-child(13) { animation-delay: 2.75s; }
  .step-data .px:nth-child(14) { animation-delay: 0.30s; }
  .step-data .px:nth-child(15) { animation-delay: 3.85s; }
  @keyframes pixel-blink {
    0% { opacity: 0.2; }
    6% { opacity: 1; }
    16% { opacity: 0.2; }
    100% { opacity: 0.2; }
  }

  /* ── VERTICAL SELECTION: 6 data bars — each lights up then fades independently ── */
  .step-select .data-bars {
    display: flex;
    gap: 2px;
    align-items: flex-end;
    height: 28px;
  }
  .step-select .bar {
    width: 4px;
    border-radius: 1px;
    background: var(--accent);
    opacity: 0.25;
    animation: bar-blink 4s linear infinite;
  }
  /* Sequential left→right wave — differentiates from data-audit's scattered dance */
  .step-select .bar:nth-child(1) { height: 14px; animation-delay: 0s; }
  .step-select .bar:nth-child(2) { height: 24px; animation-delay: 0.5s; }
  .step-select .bar:nth-child(3) { height: 10px; animation-delay: 1.0s; }
  .step-select .bar:nth-child(4) { height: 28px; animation-delay: 1.5s; }
  .step-select .bar:nth-child(5) { height: 18px; animation-delay: 2.0s; }
  .step-select .bar:nth-child(6) { height: 20px; animation-delay: 2.5s; }
  @keyframes bar-blink {
    0% { opacity: 0.25; }
    8% { opacity: 1; }
    20% { opacity: 0.25; }
    100% { opacity: 0.25; }
  }

  /* ── PAGE GENERATION: regen arc — rotates continuously ── */
  .step-gen .regen-icon {
    animation: regen-rotate 6s linear infinite;
    transform-origin: center center;
    opacity: 0.7;
  }
  @keyframes regen-rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .vertical-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-pri);
    letter-spacing: -0.01em;
    line-height: normal;
    margin-bottom: 4px;
  }
  .vertical-reason {
    font-size: 12px;
    color: var(--text-ter);
    line-height: 17px;
    max-width: 160px;
    min-height: 51px;       /* reserves 3 lines so all 3 verticals align vertically */
    text-wrap: balance;
  }

  /* Embedded mode */
  body.embedded {
    padding: 0;
    background: transparent;
    min-height: auto;
    display: block;
    overflow: hidden;
  }
  body.embedded .diagram {
    width: 100%;
    border-radius: 0;
  }

  /* Mobile @ 480px */
  @media (max-width: 480px) {
    .verticals-area { padding: 0 16px; }
    .verticals-grid { gap: 4px; }
    .vertical { padding: 0 8px; }
    .vertical-name { font-size: 11px; letter-spacing: -0.005em; text-align: left; align-self: stretch; }
    .vertical-reason {
      font-size: 10px;
      line-height: 13px;
      max-width: 100%;
      min-height: 39px;     /* 3 lines at 13px line-height — keeps mobile aligned too */
      text-align: left;
    }
  }
</style>
</head>
<body>
  <div class="diagram">
    <div class="verticals-area">
      <div class="verticals-grid">
        <!-- Step 1: Data audit -->
        <div class="vertical step-data">
          <div class="vertical-icon">
            <div class="pixel-grid">
              <div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div>
              <div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div>
              <div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div><div class="px"></div>
            </div>
          </div>
          <div class="vertical-name">Data audit</div>
          <div class="vertical-reason">Usage patterns guided experiment plan &amp; requirements</div>
        </div>

        <!-- Step 2: Vertical selection -->
        <div class="vertical step-select">
          <div class="vertical-icon">
            <div class="data-bars">
              <div class="bar"></div><div class="bar"></div><div class="bar"></div>
              <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
          </div>
          <div class="vertical-name">Vertical selection</div>
          <div class="vertical-reason">Targeting high traffic verticals maximized coverage</div>
        </div>

        <!-- Step 3: Page generation -->
        <div class="vertical step-gen">
          <div class="vertical-icon">
            <svg class="regen-icon" width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true">
              <!-- Refresh-cycle arc: ~300° open circle with arrow head -->
              <path d="M 28 8 A 20 20 0 1 1 9.4 21" stroke="var(--new-seg)" stroke-width="2" fill="none" stroke-linecap="round"/>
              <!-- Arrowhead at top endpoint -->
              <path d="M 21.5 7.5 L 28 8 L 27 14.5" stroke="var(--new-seg)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="vertical-name">Page generation</div>
          <div class="vertical-reason">Static pages refreshed regularly reduced overhead</div>
        </div>
      </div>
    </div>
  </div>

<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v1 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
</html>
