<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="figma-source" content="node:1515:1052 page:29:41 file:TArUrZsBUocaAsqetjXq7V">
  <title>SHR-06 — Share Icon Comparison</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --canvas: #0A0C16;
      --card: #10121C;
      --elevated: #151722;
      --highest: #1A1C28;
      --text-pri: #E0DFE4;
      --text-sec: rgba(224,223,228,0.6);
      --text-ter: rgba(224,223,228,0.4);
      --text-dim: rgba(224,223,228,0.2);
      --border-normal: rgba(224,223,228,0.07);
      --accent: #7FB5B0;
      --accent-hover: #8AC4BE;
      --accent-dim: rgba(127,181,176,0.12);
      --red: #C47878;
      --casual: #C4B078;
      --new-seg: #8A9EC4;
      --glass-bg: linear-gradient(135deg, rgba(224,223,228,0.05) 0%, rgba(224,223,228,0.015) 100%);
      --glass-border: rgba(224,223,228,0.08);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      background: #08090F;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--text-pri);
    }

    .diagram {
      max-width: 760px;
      width: 100%;
      background: transparent;
      border-radius: 16px;
      overflow: hidden;
      padding: 16px 48px;
    }

    .three-up {
      display: flex;
      gap: 4px;
      align-items: flex-start;
      width: 100%;
      padding: 0 16px;
    }

    .icon-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      opacity: 0;
      transform: translateY(12px);
    }
    .icon-col.c1 { animation: fadeUp 600ms var(--spring) 200ms forwards; padding-top: 16px; }
    .icon-col.c2 { animation: fadeUp 600ms var(--spring) 350ms forwards; position: relative; }
    .icon-col.c3 { animation: fadeUp 600ms var(--spring) 500ms forwards; padding-top: 16px; }

    .illustration {
      height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 19px 28px;
      border-radius: 16px;
      overflow: hidden;
    }
    .icon-col.c1 .illustration,
    .icon-col.c3 .illustration { opacity: 0.5; }
    .icon-col.c2 .illustration {
      height: 122px;
      width: 208px;
      max-width: 100%;
      align-self: center;
      padding: 8px 16px;
      padding-top: 8px;
      background: var(--highest);
      border: 1px solid var(--accent-hover);
      border-radius: 12px;
      margin-top: 10px;
    }

    .icon-disc {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-col.c1 .icon-disc,
    .icon-col.c3 .icon-disc { background: rgba(224,223,228,0.08); color: var(--text-pri); }
    .icon-col.c2 .icon-disc { background: var(--text-pri); color: var(--canvas); }
    .icon-disc svg { width: 36px; height: 36px; display: block; }

    /* BEST FIT crown pill (anchored to top-left of c2 illustration) */
    .best-fit {
      position: absolute;
      top: 0;
      left: 28px;
      z-index: 2;
      background: var(--accent);
      border: 1px solid var(--accent-hover);
      border-radius: 999px;
      padding: 4px 12px 4px 16px;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--canvas);
      text-transform: uppercase;
      white-space: nowrap;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(-6px);
      animation: badgeDrop 500ms var(--spring) 750ms forwards;
    }
    @keyframes badgeDrop {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Caption block */
    .col-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 8px;
      width: 100%;
    }
    .col-title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-pri);
      line-height: 1.3;
    }
    .col-trait {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 9px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--text-sec);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile: stack 3 columns vertically */
    @media (max-width: 480px) {
      .diagram { padding: 16px 16px; }
      .three-up { flex-direction: column; gap: 20px; padding: 0; }
      .icon-col.c1, .icon-col.c3 { padding-top: 0; }
      .icon-col.c2 .illustration { width: 100%; max-width: 280px; }
      .best-fit { left: 16px; }
    }

    /* Embed mode: strip body chrome when loaded in iframe */
    body.embedded {
      padding: 0;
      min-height: auto;
      display: block;
      background: transparent;
      overflow: hidden;
      align-items: initial;
    }
    body.embedded .diagram {
      width: 100%;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div class="diagram">
    <div class="three-up">

      <!-- C1: Connected nodes (rejected — least recognized) -->
      <div class="icon-col c1">
        <div class="illustration">
          <div class="icon-disc">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="9" cy="9" r="3.5" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="27" cy="9" r="3.5" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="18" cy="27" r="3.5" stroke="currentColor" stroke-width="1.8"/>
              <line x1="11.5" y1="11" x2="16" y2="24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <line x1="24.5" y1="11" x2="20" y2="24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        <div class="col-content">
          <div class="col-title">Connected nodes</div>
          <div class="col-trait">Users were least likely to recognize this icon as &ldquo;share&rdquo;</div>
        </div>
      </div>

      <!-- C2: Curved arrow (BEST FIT — winner) -->
      <div class="icon-col c2">
        <div class="best-fit">&check; Best fit</div>
        <div class="illustration">
          <div class="icon-disc">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M7 22c0-6 3.5-10 11-10h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M20 7l6 5-6 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
        </div>
        <div class="col-content">
          <div class="col-title">Curved arrow</div>
          <div class="col-trait">Highly recognized and did not visually conflict with other actions</div>
        </div>
      </div>

      <!-- C3: Export sheet (rejected — confused with download) -->
      <div class="icon-col c3">
        <div class="illustration">
          <div class="icon-disc">
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M18 5v17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M12 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path d="M8 20v8a2 2 0 002 2h16a2 2 0 002-2v-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
          </div>
        </div>
        <div class="col-content">
          <div class="col-title">Export sheet</div>
          <div class="col-trait">Similarity to &ldquo;download&rdquo; icon caused confusion</div>
        </div>
      </div>

    </div>
  </div>

<script>if(window!==window.parent)document.body.classList.add('embedded');</script>
<!-- diagram-height-poster v1 -->
<script>
(function () {
  function compute() {
    var d = document.querySelector('.diagram');
    if (d) {
      var rect = d.getBoundingClientRect();
      if (rect.height > 0) return Math.ceil(rect.height);
    }
    return Math.max(
      document.documentElement ? document.documentElement.scrollHeight : 0,
      document.body ? document.body.scrollHeight : 0
    );
  }
  function send() {
    if (!window.parent || window.parent === window) return;
    var h = compute();
    if (h > 0) window.parent.postMessage({ type: 'diagram-height', height: h }, '*');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', send);
  else send();
  window.addEventListener('load', send);
  setTimeout(send, 50); setTimeout(send, 250); setTimeout(send, 1000);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(send);
    var d = document.querySelector('.diagram');
    if (d) ro.observe(d);
    if (document.body) ro.observe(document.body);
  }
  window.addEventListener('resize', function () {
    requestAnimationFrame(send);
    setTimeout(send, 50);
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'request-diagram-height') {
      requestAnimationFrame(send);
    }
  });
})();
</script>
</body>
</html>
